# dnsmasq configuration
# Resolve internal service names to their current IPs
# Update these when IPs change — no container rebuild needed
# NOTE: Runtime DNS mappings are managed by the dns-sync sidecar via Identity settings.
# Only static entries for services NOT managed by dns-sync belong here.

# Upstream DNS (fallback for external names)
server=8.8.8.8
server=1.1.1.1

# Don't forward local names
local=/local/
