services:
  redis:
    image: redis:7-alpine
    container_name: sharedllm_test_redis
    ports:
      - "6397:6379"
    command: redis-server --appendonly no

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        - BASE_IMAGE=sharedllm-base:local
    container_name: sharedllm_test_identity
    image: ghcr.io/jmiahman1/sharedllm-identity:latest
    ports:
      - "8011:8001"
    environment:
      - IDENTITY_DATABASE_URL=sqlite:////tmp/identity_test.db
      - INTERNAL_SECRET=test-secret-ci
      - FERNET_KEY=${FERNET_KEY:-g13l5bpIeVaVe4ri66RE0bPYpB9IjCYdObQAKJU2Z14=}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-mock-admin-password-for-testing}
      - INIT_DB=true
      - TEST_MODE=true
    volumes:
      - ./test.env:/app/.env:ro

  execution:
    build:
      context: .
      dockerfile: services/execution/Dockerfile
      args:
        - BASE_IMAGE=sharedllm-base:local
    container_name: sharedllm_test_execution
    image: ghcr.io/jmiahman1/sharedllm-execution:latest
    ports:
      - "8012:8003"
    environment:
      - INTERNAL_SECRET=test-secret-ci
      - FERNET_KEY=${FERNET_KEY:-g13l5bpIeVaVe4ri66RE0bPYpB9IjCYdObQAKJU2Z14=}
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://searxng_mock:8080
      - EXECUTION_EXTERNAL_HOST=127.0.0.1
      - TEST_MODE=true
      - HOME=/home/sharedllm
      - WORKSPACE_ROOT=/tmp/workspaces
      - HA_URL=http://ha.example.com:8095
      - HA_TOKEN=test-ha-token
      - TEMP_MEDIA_DIR=/tmp/media
      - MODELS_DIR=/tmp/models
      - DEFAULT_TTS_VOICE=test-voice
    volumes:
      - test_execution_data:/data

  rag:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        - BASE_IMAGE=sharedllm-base:local
    container_name: sharedllm_test_rag
    image: ghcr.io/jmiahman1/sharedllm-rag:latest
    ports:
      - "8013:8004"
    environment:
      - INTERNAL_SECRET=test-secret-ci
      - FERNET_KEY=${FERNET_KEY:-g13l5bpIeVaVe4ri66RE0bPYpB9IjCYdObQAKJU2Z14=}
      - OLLAMA_URL=http://ollama_mock:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - CHROMA_PERSIST_DIR=/tmp/chroma_test
      - TEST_MODE=true
    volumes:
      - test_chroma_data:/tmp/chroma_test

  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
      args:
        - BASE_IMAGE=sharedllm-base:local
    container_name: sharedllm_test_storage
    image: ghcr.io/jmiahman1/sharedllm-storage:latest
    ports:
      - "8014:8005"
    environment:
      - INTERNAL_SECRET=test-secret-ci
      - FERNET_KEY=${FERNET_KEY:-g13l5bpIeVaVe4ri66RE0bPYpB9IjCYdObQAKJU2Z14=}
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution:8003
      - HA_URL=http://ha.example.com:8095
      - HA_TOKEN=test-ha-token
      - WORKSPACE_ROOT=/tmp/workspaces
      - TEMP_MEDIA_DIR=/tmp/media
      - MODELS_DIR=/tmp/models
      - DEFAULT_TTS_VOICE=test-voice
      - TEST_MODE=true

  logging:
    build:
      context: .
      dockerfile: services/logging/Dockerfile
      args:
        - BASE_IMAGE=sharedllm-base:local
    container_name: sharedllm_test_logging
    image: ghcr.io/jmiahman1/sharedllm-logging:latest
    ports:
      - "8015:8006"
    environment:
      - INTERNAL_SECRET=test-secret-ci
      - FERNET_KEY=${FERNET_KEY:-g13l5bpIeVaVe4ri66RE0bPYpB9IjCYdObQAKJU2Z14=}
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_SVC_URL=http://execution:8003
      - HA_URL=http://ha.example.com:8095
      - HA_TOKEN=test-ha-token
      - WORKSPACE_ROOT=/tmp/workspaces
      - TEMP_MEDIA_DIR=/tmp/media
      - MODELS_DIR=/tmp/models
      - DEFAULT_TTS_VOICE=test-voice
      - TEST_MODE=true
    depends_on:
      - redis

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        - BASE_IMAGE=sharedllm-base:local
    container_name: sharedllm_test_gateway
    image: ghcr.io/jmiahman1/sharedllm-gateway:latest
    ports:
      - "8016:11435"
    environment:
      - INTERNAL_SECRET=test-secret-ci
      - FERNET_KEY=${FERNET_KEY:-g13l5bpIeVaVe4ri66RE0bPYpB9IjCYdObQAKJU2Z14=}
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - CONTROL_PLANE_URL=http://control_plane:8008
      - REDIS_URL=redis://redis:6379/0
      - TEST_MODE=true
      - HA_URL=http://ha.example.com:8095
      - HA_TOKEN=test-ha-token
      - WORKSPACE_ROOT=/tmp/workspaces
      - TEMP_MEDIA_DIR=/tmp/media
      - MODELS_DIR=/tmp/models
      - DEFAULT_TTS_VOICE=test-voice
    depends_on:
      - identity
      - redis

  workspace_runtime:
    build:
      context: .
      dockerfile: services/workspace_runtime/Dockerfile
      args:
        - BASE_IMAGE=sharedllm-base:local
    container_name: sharedllm_test_workspace_runtime
    image: ghcr.io/jmiahman1/sharedllm-workspace_runtime:latest
    ports:
      - "8007:8007"
    environment:
      - INTERNAL_SECRET=test-secret-ci
      - FERNET_KEY=${FERNET_KEY:-g13l5bpIeVaVe4ri66RE0bPYpB9IjCYdObQAKJU2Z14=}
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - WORKSPACE_DATABASE_URL=sqlite:////tmp/workspace_runtime_test.db
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/tmp/workspaces
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama_mock:11434
      - GIT_WEBHOOK_SECRET=test-webhook-secret
      - TEST_MODE=true
      - HOME=/home/raven
      - WORKSPACE_ROOT=/tmp/workspaces
    volumes:
      - ./test.env:/app/.env:ro
      - ./config/workspaces.json:/app/config/workspaces.json:ro
    depends_on:
      - redis
      - identity

  ollama_mock:
    image: python:3.11-slim
    container_name: sharedllm_test_ollama_mock
    command: >
      python -c "
      from fastapi import FastAPI;
      from fastapi.responses import JSONResponse;
      app = FastAPI();
      @app.get('/api/tags');
      async def tags(): return JSONResponse({'models':[]});
      @app.post('/api/generate');
      @app.post('/api/chat');
      async def generate(): return JSONResponse({'response':'ok','done':True});
      @app.get('/health');
      async def health(): return JSONResponse({'status':'ok'});
      import uvicorn;
      uvicorn.run(app, host='0.0.0.0', port=11434)
      "
    ports:
      - "11444:11434"

  searxng_mock:
    image: python:3.11-slim
    container_name: sharedllm_test_searxng_mock
    command: >
      python -c "
      from fastapi import FastAPI, Request;
      from fastapi.responses import HTMLResponse, JSONResponse;
      app = FastAPI();
      @app.get('/search');
      async def search(q: str): return HTMLResponse('<html></html>');
      @app.get('/health');
      async def health(): return JSONResponse({'status':'ok'});
      import uvicorn;
      uvicorn.run(app, host='0.0.0.0', port=8080)
      "
    ports:
      - "8090:8080"

volumes:
  test_execution_data:
  test_chroma_data:
