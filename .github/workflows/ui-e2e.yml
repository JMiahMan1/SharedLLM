name: UI E2E

# One run per branch, newest wins -- except on the nightly schedule, which
# must not cancel a run someone started by hand.
concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# The hermetic Playwright suite in Chromium at every size the app is used at:
# desktop, Pixel 7, a small phone (360x740) and a tablet in portrait and
# landscape. It runs on every push that touches the UI's source, so each UI
# change is checked across formats. A nightly run is
# enough to notice drift in the app; on `microservices` it also runs whenever a
# spec or this file changes, because GitHub only schedules and dispatches the
# default branch's workflows. Once this file is on `main`, the schedule and
# workflow_dispatch are the whole story.
#
# The media visual baselines are per-platform (`*-darwin.png`), so SKIP_VISUAL
# keeps a Linux runner from comparing a Mac render with a Linux one (see
# playwright.config.ts). The `hermetic-iphone` project needs WebKit and is not
# part of this job.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [microservices]
    paths:
      - 'services/ui/e2e/**'
      - 'services/ui/src/**'
      - 'services/ui/playwright.config.ts'
      - 'services/ui/vite.config.ts'
      - 'services/ui/package-lock.json'
      - '.github/workflows/ui-e2e.yml'

permissions:
  contents: read

jobs:
  hermetic:
    # `ubuntu-latest` moved to 26.04, which Playwright 1.59.1 refuses to install
    # Chromium on ("not officially supported"); 24.04 is a supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Five screen sizes x three thirds: fifteen runners. Halves still took
      # 9 to 16 minutes each (about a minute of it setup), so the slowest half
      # was the whole workflow; a failure names the third it came from.
      matrix:
        project:
          - hermetic-desktop
          - hermetic-mobile
          - hermetic-small-phone
          - hermetic-tablet-portrait
          - hermetic-tablet-landscape
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      # The browser download is ~150MB per run and changes only when Playwright
      # does: key the cache on the version in the lockfile.
      - name: Playwright version
        id: playwright
        working-directory: services/ui
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('services/ui/package-lock.json') }}

      - name: Install Chromium and its system libraries
        working-directory: services/ui
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            # The browser is cached; the OS libraries are not, and they come from apt.
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run the hermetic suite (${{ matrix.project }})
        working-directory: services/ui
        env:
          SKIP_VISUAL: '1'
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --reporter=line,html --workers=2

      # Every run, not only a failed one: the per-page, per-format screenshots
      # are attached to the report.
      - name: Upload the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            services/ui/playwright-report
            services/ui/test-results
          retention-days: 7

  # The layout checks again, against the production build the family runs
  # (web, and the Android app's OTA bundle), at the two phone sizes. The dev
  # server skips the build's CSS optimizer, so a stylesheet it rewrites breaks
  # only the built app: lightningcss once dropped every unprefixed
  # backdrop-filter, and pages measured as ending under the bottom bar.
  # Runs every spec that checks the bottom bar, plus e2e/layout.
  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - hermetic-mobile
          - hermetic-small-phone

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      # `vite build` alone: the OTA zip that `npm run build` adds is not needed
      # to serve dist/.
      - name: Production build
        working-directory: services/ui
        run: npx vite build

      - name: Playwright version
        id: playwright
        working-directory: services/ui
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('services/ui/package-lock.json') }}

      - name: Install Chromium and its system libraries
        working-directory: services/ui
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Layout specs against the build (${{ matrix.project }})
        working-directory: services/ui
        env:
          SKIP_VISUAL: '1'
          UI_SERVE: preview
        run: |
          specs=$(grep -rlE 'expectClearOfBottomBar|expectLayoutSound' e2e --include='*.spec.ts' | sort)
          test -n "$specs"
          npx playwright test --project=${{ matrix.project }} --reporter=line,html --workers=2 e2e/layout $specs

      - name: Upload the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production-build-${{ matrix.project }}
          path: |
            services/ui/playwright-report
            services/ui/test-results
          retention-days: 7
