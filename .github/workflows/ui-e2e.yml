name: UI E2E

# The hermetic Playwright suite in Chromium at every size the app is used at:
# desktop, Pixel 7, a small phone (360x740) and a tablet in portrait and
# landscape. It runs on every push that touches the UI's source, so each UI
# change is checked across formats. A nightly run is
# enough to notice drift in the app; on `microservices` it also runs whenever a
# spec or this file changes, because GitHub only schedules and dispatches the
# default branch's workflows. Once this file is on `main`, the schedule and
# workflow_dispatch are the whole story.
#
# The media visual baselines are per-platform (`*-darwin.png`), so SKIP_VISUAL
# keeps a Linux runner from comparing a Mac render with a Linux one (see
# playwright.config.ts). The `hermetic-iphone` project needs WebKit and is not
# part of this job.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [microservices]
    paths:
      - 'services/ui/e2e/**'
      - 'services/ui/src/**'
      - 'services/ui/playwright.config.ts'
      - '.github/workflows/ui-e2e.yml'

permissions:
  contents: read

jobs:
  hermetic:
    # `ubuntu-latest` moved to 26.04, which Playwright 1.59.1 refuses to install
    # Chromium on ("not officially supported"); 24.04 is a supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      - name: Install Chromium
        working-directory: services/ui
        run: npx playwright install --with-deps chromium

      - name: Run the hermetic suite
        working-directory: services/ui
        env:
          SKIP_VISUAL: '1'
        run: npx playwright test --project=hermetic-desktop --project=hermetic-mobile --project=hermetic-small-phone --project=hermetic-tablet-portrait --project=hermetic-tablet-landscape --reporter=line,html --workers=2

      # Every run, not only a failed one: the per-page, per-format screenshots
      # are attached to the report.
      - name: Upload the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            services/ui/playwright-report
            services/ui/test-results
          retention-days: 7
