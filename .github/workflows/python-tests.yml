name: Python Tests
on:
  push:
    branches: [ "main", "annoucements" ]
    paths:
      - 'app/**'
      - 'test/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'test/**'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    # We bring up Redis as a service because several tests rely on GlobalResources.redis_client
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio flake8 aioresponses aiohttp aiobreaker

    - name: Lint with flake8
      run: |
        # Stop build on syntax errors and undefined names
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warn on all other issues (non-blocking)
        flake8 app/ --count --exit-zero --max-complexity=15 --max-line-length=200 --statistics

    - name: Run PyTest with Coverage
      env:
        # Mocking environment variables to prevent test stalls
        REDIS_URL: "redis://127.0.0.1:6379/0"
        OLLAMA_URL: "http://127.0.0.1:11434"
        HA_URL: "http://127.0.0.1:8123"
        HA_TOKEN: "dummy_token"
        DEFAULT_MODEL: "llama3"
      run: |
        # Run LLM reasoning tests strictly
        pytest app/tests/test_llm_reasoning.py -v
        # Run unit tests only (integration tests require live services)
        pytest --cov=app --cov-report=xml --cov-report=term test/unit/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false
