name: Python Tests
on:
  push:
    branches: [ "main", "annoucements" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # We bring up Redis as a service because several tests rely on GlobalResources.redis_client
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run PyTest with Coverage
      env:
        # Mocking environment variables to prevent test stalls
        REDIS_URL: "redis://127.0.0.1:6379/0"
        OLLAMA_URL: "http://127.0.0.1:11434"
        HA_URL: "http://127.0.0.1:8123"
        HA_TOKEN: "dummy_token"
        DEFAULT_MODEL: "llama3"
      run: |
        # Skip legacy_root if pytest.ini ignores it, but just ensuring we run everything valid
        pytest --cov=app --cov-report=xml --cov-report=term test/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false
