name: Android APK Build

on:
  push:
    branches: [ main, microservices ]
    paths:
      - 'services/ui/**'
  pull_request:
    branches: [ main, microservices ]
    paths:
      - 'services/ui/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: services/ui/package-lock.json

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: |
        npm ci

    - name: Install Capacitor Android platform
      run: npx cap add android || true

    - name: Build web assets
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Accept Android licenses and install platform tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

    # Keystore is NOT in git — restore from Actions secrets before any Gradle sign step
    - name: Restore release keystore from secrets
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
          echo "::error::Missing RELEASE_KEYSTORE / KEYSTORE_PASSWORD / KEY_PASSWORD secrets"
          exit 1
        fi
        printf '%s' "$RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore
        printf 'storePassword=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > android/app/keystore.properties
        chmod 600 android/app/release.keystore android/app/keystore.properties

    - name: Build Debug APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew clean assembleDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-debug-apk
        path: services/ui/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload OTA Web Bundle
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-web-bundle
        path: |
          services/ui/dist/bundle.zip
          services/ui/dist/version.json
        retention-days: 30

    - name: Build Release APK (self-signed)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --no-daemon --stacktrace

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-release-apk
        path: services/ui/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    # Keep legacy artifact name so deploy_remote.sh keeps working
    - name: Upload Release APK (legacy name)
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-release-unsigned-apk
        path: services/ui/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    # Publish the freshly built APK so the in-app "new version available"
    # notice can clear. The gateway reads the version code out of the
    # uploaded file, so this never has to state one -- which is what let a
    # build.gradle-derived number drift ahead of the real artifact and leave
    # users told to update forever.
    #
    # Skipped on pull requests: a fork's APK must never be published.
    - name: Publish APK to the update server
      if: github.event_name != 'pull_request'
      # The job defaults run steps from services/ui, but the paths below are
      # root-relative to match the upload-artifact steps above.
      working-directory: .
      env:
        PUBLISH_URL: ${{ secrets.APK_PUBLISH_URL }}
        INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        GIT_SHA: ${{ github.sha }}
        APK_PATH: services/ui/android/app/build/outputs/apk/release/app-release.apk
      run: |
        if [ -z "$PUBLISH_URL" ] || [ -z "$INTERNAL_SECRET" ]; then
          echo "::notice::APK_PUBLISH_URL / INTERNAL_SECRET not configured; skipping publish."
          echo "::notice::The APK is still available as the jarvis-os-release-apk artifact."
          exit 0
        fi
        if [ ! -f "$APK_PATH" ]; then
          echo "::error::Built APK not found at $APK_PATH"
          exit 1
        fi
        VERSION=$(python3 -c "import json;print(json.load(open('services/ui/package.json'))['version'])")
        curl --fail-with-body --retry 3 --retry-delay 5 --max-time 300 \
          -H "X-Internal-Secret: $INTERNAL_SECRET" \
          -F "apk=@$APK_PATH" \
          -F "version=$VERSION" \
          -F "git_sha=$GIT_SHA" \
          -F "release_notes=Android build ${GIT_SHA:0:8}" \
          "$PUBLISH_URL"
        echo "[OK] Published APK build ${GIT_SHA:0:8}."
