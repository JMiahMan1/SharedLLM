name: Build OSRM map

# The road network that snaps trip routes to roads (services/geo/map_match.py).
# Prepared here because it needs several GB of memory the server does not
# spare; the server pulls the finished image like any other service.
on:
  push:
    branches: [ microservices ]
    paths:
      - 'osrm/**'
      - '.github/workflows/osrm-map.yml'
  workflow_dispatch:
    inputs:
      regions:
        description: 'Geofabrik .osm.pbf URLs, space-separated (default: osrm/regions.txt)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  # Image names (per profile, below) are lowercase: they must be, and the
  # owner is JMiahMan1.
  OSRM: ghcr.io/project-osrm/osrm-backend:v6.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Roads, for trips (OSRM_URL)
          - profile: car
            image: ghcr.io/jmiahman1/sharedllm-osrm
          # Paths, trails and sidewalks, for workout routes (OSRM_FOOT_URL)
          - profile: foot
            image: ghcr.io/jmiahman1/sharedllm-osrm-foot
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Regions
        id: regions
        run: |
          if [ -n "${{ github.event.inputs.regions }}" ]; then
            echo "${{ github.event.inputs.regions }}" | tr ' ' '\n' | grep -E '^https://download\.geofabrik\.de/.+\.osm\.pbf$' > osrm/regions.txt.new
            { grep '^#' osrm/regions.txt; cat osrm/regions.txt.new; } > osrm/regions.tmp && mv osrm/regions.tmp osrm/regions.txt
          fi
          grep -v '^#' osrm/regions.txt | grep -v '^\s*$' > urls.txt
          test -s urls.txt
          cat urls.txt

      - name: Download and merge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p dl osrm/data
          i=0
          while read -r url; do
            i=$((i+1)); curl -fsSL --retry 3 -o "dl/$i.osm.pbf" "$url"
          done < urls.txt
          if [ "$(ls dl | wc -l)" = 1 ]; then mv dl/1.osm.pbf osrm/data/region.osm.pbf
          else osmium merge dl/*.osm.pbf -o osrm/data/region.osm.pbf; fi
          ls -lh osrm/data

      - name: Prepare (extract, partition, customize)
        run: |
          run() { docker run --rm -v "$PWD/osrm/data:/data" "$OSRM" "$@"; }
          run osrm-extract -p /opt/${{ matrix.profile }}.lua /data/region.osm.pbf
          run osrm-partition /data/region.osrm
          run osrm-customize /data/region.osrm
          rm osrm/data/region.osm.pbf
          # OSRM runs as root and writes region.osrm.fileIndex mode 0700; the
          # image build reads the context as the runner user, so that file was
          # copied empty and osrm-routed could not map it.
          sudo chown -R "$(id -u):$(id -g)" osrm/data
          chmod -R a+rX osrm/data
          if find osrm/data -type f -size 0 | grep -q .; then
            echo "empty map files:"; find osrm/data -type f -size 0; exit 1
          fi
          du -sh osrm/data

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: osrm
          file: osrm/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
