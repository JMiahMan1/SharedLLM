name: Build & Push Images

on:
  push:
    branches: [ main, master, microservices ]
    paths:
      - 'services/**'
      - 'docker/**'
      - 'requirements.txt'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [ main, master, microservices ]
    paths:
      - 'services/**'
      - 'docker/**'
      - 'requirements.txt'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: jmiahman1
  REPO_NAME: sharedllm

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      build_base: ${{ steps.set-outputs.outputs.build_base }}
      services: ${{ steps.set-outputs.outputs.services }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1' }}
          filters: |
            base:
              - 'docker/Dockerfile.base'
              - 'requirements.txt'
              - '.github/workflows/build-images.yml'
            ui:
              - 'services/ui/**'
              - '.github/workflows/build-images.yml'
            identity:
              - 'services/identity/**'
            gateway:
              - 'services/gateway/**'
            rag:
              - 'services/rag/**'
            execution:
              - 'services/execution/**'
            storage:
              - 'services/storage/**'
            logging:
              - 'services/logging/**'
            automation:
              - 'services/automation/**'
            workspace_runtime:
              - 'services/workspace_runtime/**'
            dns_sync:
              - 'services/dns_sync/**'
            control_plane:
              - 'services/control_plane/**'

      - name: Set Outputs
        id: set-outputs
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          echo "Changes detected: $CHANGES"
          
          # If base changed, build all services
          if echo "$CHANGES" | grep -q '"base"'; then
            SERVICES_JSON='["identity","gateway","rag","execution","storage","logging","automation","workspace_runtime","dns_sync","control_plane"]'
            BUILD_BASE='true'
          else
            # Filter out base and ui from changes to build only changed services
            SERVICES_JSON=$(echo "$CHANGES" | jq -c '[.[] | select(. != "base" and . != "ui")]')
            BUILD_BASE='false'
          fi
          
          echo "build_base=$BUILD_BASE" >> $GITHUB_OUTPUT
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT

  build-base:
    name: Build & Push Shared Base
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.build_base == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get branch slug
        id: slug
        run: echo "slug=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-base
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.slug.outputs.slug }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  build-services:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [detect-changes, build-base]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get branch slug
        id: slug
        run: echo "slug=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine base image tag
        id: base-tag
        run: |
          TAG="${{ steps.slug.outputs.slug }}"
          # Try to pull the branch-specific base image. If it fails, fall back to latest.
          if docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-base:$TAG" 2>/dev/null; then
            echo "Using branch-specific base image tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "Branch-specific base image not found, falling back to latest"
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.slug.outputs.slug }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Set build args
        id: build-args
        run: |
          echo "GIT_SHA=${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "SERVICE_NAME=${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.service }}
         uses: docker/build-push-action@v6
         with:
           context: .
           file: services/${{ matrix.service }}/Dockerfile
           push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
           tags: ${{ steps.meta.outputs.tags }}
           labels: ${{ steps.meta.outputs.labels }}
           build-args: |
             BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-base:${{ steps.base-tag.outputs.tag }}
             GIT_SHA=${{ steps.build-args.outputs.GIT_SHA }}
             BUILD_DATE=${{ steps.build-args.outputs.BUILD_DATE }}
             SERVICE_NAME=${{ steps.build-args.outputs.SERVICE_NAME }}
           platforms: linux/amd64
           cache-from: type=gha
           cache-to: type=gha,mode=max
           no-cache: ${{ github.event_name == 'workflow_dispatch' }}

  build-ui:
    name: Build & Push UI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.ui == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get branch slug
        id: slug
        run: echo "slug=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-ui
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.slug.outputs.slug }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Set build args
        id: build-args
        run: |
          echo "GIT_SHA=${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: services/ui
          file: services/ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.build-args.outputs.GIT_SHA }}
            BUILD_DATE=${{ steps.build-args.outputs.BUILD_DATE }}
          platforms: linux/amd64
