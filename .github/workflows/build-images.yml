name: Build & Push Images

on:
  push:
    branches: [ main, master, microservices ]
    paths:
      - 'services/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'tools/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [ main, master, microservices ]
    paths:
      - 'services/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'tools/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

# A new push to a pull request cancels that PR's previous build, which only
# checks that the images still build. Pushes to a branch publish images and
# pick their services from the diff against the previous push, so a cancelled
# or superseded push run would never publish its services: each push run gets
# a group of its own and always finishes.
concurrency:
  group: build-images-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: jmiahman1
  REPO_NAME: sharedllm

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      build_base: ${{ steps.set-outputs.outputs.build_base }}
      services: ${{ steps.set-outputs.outputs.services }}
      ui: ${{ steps.filter.outputs.ui }}
      caddy: ${{ steps.filter.outputs.caddy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base commit for path filtering
        id: base
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ github.event.before }}" >> $GITHUB_OUTPUT
          else
            echo "ref=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)" >> $GITHUB_OUTPUT
          fi

      - name: Filter Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            # Only what the base image is built from: it copies no source,
            # and rebuilding it makes every deploy pull gigabytes again.
            base:
              - 'docker/Dockerfile.base'
            caddy:
              - 'Caddyfile'
              - 'docker/Dockerfile.caddy'
            ui:
              - 'services/ui/**'
              - 'services/config.py'
            identity:
              - 'services/identity/**'
              - 'services/common/**'
              - 'services/config.py'
            gateway:
              - 'services/gateway/**'
              - 'services/common/**'
              - 'services/config.py'
            rag:
              - 'services/rag/**'
              - 'services/common/**'
              - 'services/config.py'
            execution:
              - 'services/execution/**'
              - 'services/common/**'
              - 'services/config.py'
              - 'services/workspace_sandbox.py'
              - 'tools/webscraper.py'
              - 'tools/vision_ocr.py'
              - 'scripts/index_capabilities.py'
            storage:
              - 'services/storage/**'
              - 'services/common/**'
              - 'services/config.py'
            logging:
              - 'services/logging/**'
              - 'services/common/**'
              - 'services/config.py'
            automation:
              - 'services/automation/**'
              - 'services/common/**'
              - 'services/config.py'
            telemetry:
              - 'services/telemetry/**'
              - 'services/common/**'
              - 'services/config.py'
            workspace_runtime:
              - 'services/workspace_runtime/**'
              - 'services/common/**'
              - 'services/config.py'
              - 'services/workspace_sandbox.py'
            control_plane:
              - 'services/control_plane/**'
              - 'services/common/**'
              - 'services/config.py'
            geo:
              - 'services/geo/**'
              - 'services/common/**'
              - 'services/config.py'
            bible:
              - 'services/bible/**'
              - 'services/common/**'
              - 'services/config.py'
            health:
              - 'services/health/**'
              - 'services/common/**'
              - 'services/config.py'
            homehub:
              - 'services/homehub/**'
              - 'services/common/**'
              - 'services/config.py'
            dns:
              - 'services/dns/**'
              - 'services/common/**'
              - 'services/config.py'
            garden:
              - 'services/garden/**'
              - 'services/common/**'
              - 'services/config.py'
              - 'data/plants_seed/**'
              - 'scripts/build_plants_seed.py'

      - name: Set Outputs
        id: set-outputs
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          echo "Changes detected: $CHANGES"
          
          # If base changed, build all services
          if echo "$CHANGES" | grep -q '"base"'; then
            SERVICES_JSON='["identity","gateway","rag","execution","storage","logging","automation","workspace_runtime","control_plane","dns","geo","bible","telemetry","health","homehub","garden"]'
            BUILD_BASE='true'
          else
            # Filter out base, caddy, and ui from changes to build only changed services
            SERVICES_JSON=$(echo "$CHANGES" | jq -c '[.[] | select(. != "base" and . != "caddy" and . != "ui")]')
            BUILD_BASE='false'
          fi
          
          # A pull request's image build only checks that the image still builds; its code is checked by
          # the test suites and the image is built once, after merge. So a PR builds a service only when
          # something the image is made from changed: its Dockerfile, its requirements, or docker/.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ steps.base.outputs.ref }}" HEAD)
            if echo "$CHANGED" | grep -q '^docker/'; then
              echo "docker/ changed: building every changed service"
            else
              KEEP='[]'
              for svc in $(echo "$SERVICES_JSON" | jq -r '.[]'); do
                if echo "$CHANGED" | grep -qE "^services/${svc}/(Dockerfile[^/]*|requirements[^/]*\.txt)$"; then
                  KEEP=$(echo "$KEEP" | jq -c --arg s "$svc" '. + [$s]')
                fi
              done
              echo "Pull request: building only services whose Dockerfile or requirements changed: $KEEP"
              SERVICES_JSON="$KEEP"
            fi
          fi

          echo "build_base=$BUILD_BASE" >> $GITHUB_OUTPUT
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT

  build-base:
    name: Build & Push Shared Base
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.build_base == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get branch slug
        id: slug
        run: echo "slug=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-base
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.slug.outputs.slug }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, next to the image (see build-services).
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-base:buildcache
            type=gha,scope=base
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('type=registry,ref={0}/{1}/{2}-base:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAMESPACE, env.REPO_NAME) || '' }}
          platforms: linux/amd64

  build-services:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [detect-changes, build-base]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get branch slug
        id: slug
        run: echo "slug=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine base image tag
        id: base-tag
        run: |
          TAG="${{ steps.slug.outputs.slug }}"
          # Try to pull the branch-specific base image. If it fails, fall back to latest.
          # Ask the registry whether the tag exists: pulling it to find out
          # downloaded the multi-GB base onto a runner whose buildx builder
          # then fetched it again on its own.
          if docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-base:$TAG" >/dev/null 2>&1; then
            echo "Using branch-specific base image tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "Branch-specific base image not found, falling back to latest"
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.slug.outputs.slug }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Set build args
        id: build-args
        run: |
          echo "GIT_SHA=${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "SERVICE_NAME=${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The layer cache lives in the registry, as a `buildcache` tag beside
          # each image. It was in the Actions cache (one scope per image), but
          # that holds 10 GB for the whole repository and the images' layers
          # alone were 7 GB of it, so every build evicted another's blobs:
          # execution's cache manifest was found, its layers were not ("blob
          # ... not found"), and everything after the first apt step rebuilt
          # on every run (6 minutes). The eviction also took the pip, npm and
          # Playwright caches with it. Only pushes write the cache; pull
          # requests read the one their base branch wrote. The gha scope is
          # still read until the registry cache has been written once.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-${{ matrix.service }}:buildcache
            type=gha,scope=${{ matrix.service }}
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('type=registry,ref={0}/{1}/{2}-{3}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAMESPACE, env.REPO_NAME, matrix.service) || '' }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-base:${{ steps.base-tag.outputs.tag }}
            GIT_SHA=${{ steps.build-args.outputs.GIT_SHA }}
            BUILD_DATE=${{ steps.build-args.outputs.BUILD_DATE }}
            SERVICE_NAME=${{ steps.build-args.outputs.SERVICE_NAME }}
          # A build-time secret (never in a layer): execution's camoufox step asks
          # GitHub's API for its browser, and anonymous calls from shared runners
          # are refused (403) once the runner's IP has used its quota.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64

  build-ui:
    name: Build & Push UI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.ui == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get branch slug
        id: slug
        run: echo "slug=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-ui
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.slug.outputs.slug }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Set build args
        id: build-args
        run: |
          echo "GIT_SHA=${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: services/ui
          file: services/ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-ui:buildcache
            type=gha,scope=ui
          cache-to: ${{ format('type=registry,ref={0}/{1}/{2}-ui:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAMESPACE, env.REPO_NAME) }}
          build-args: |
            GIT_SHA=${{ steps.build-args.outputs.GIT_SHA }}
            BUILD_DATE=${{ steps.build-args.outputs.BUILD_DATE }}
            VITE_DEFAULT_SERVER_URL=${{ vars.VITE_DEFAULT_SERVER_URL }}
          platforms: linux/amd64

  build-caddy:
    name: Build & Push Caddy
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.caddy == 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get branch slug
        id: slug
        run: echo "slug=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-caddy
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.slug.outputs.slug }},enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.REPO_NAME }}-caddy:buildcache
            type=gha,scope=caddy
          cache-to: ${{ format('type=registry,ref={0}/{1}/{2}-caddy:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAMESPACE, env.REPO_NAME) }}
          platforms: linux/amd64
