name: UI CI

# One run per branch: a new push cancels the previous run instead of queueing
# behind it. Tag pushes are not a UI change.
concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, microservices, 'feat/**']
    paths:
      - 'services/ui/**'
  pull_request:
    paths:
      - 'services/ui/**'

jobs:
  # Three jobs, one runner each, all at once. They used to be five steps in one
  # job, so a lint failure waited for npm ci and the typecheck waited for lint.
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: services/ui/package-lock.json

    - name: Install dependencies
      working-directory: services/ui
      run: npm ci

    - name: Run Lint
      working-directory: services/ui
      run: npm run lint

    # The root tsconfig only references the real configs ("files": []), so
    # plain `tsc -p .` checks nothing, and the Vite build strips types without
    # checking them. This is the step that actually typechecks the UI.
    - name: Typecheck
      working-directory: services/ui
      run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: services/ui/package-lock.json

    # msw is a devDependency already: `npm install -D msw` here re-resolved the
    # whole lockfile on every run for nothing.
    - name: Install dependencies
      working-directory: services/ui
      run: npm ci

    - name: Run Unit Tests
      working-directory: services/ui
      run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: services/ui/package-lock.json

    - name: Install dependencies
      working-directory: services/ui
      run: npm ci

    - name: Build
      working-directory: services/ui
      run: npm run build
