name: UI CI

# One run per branch: a new push cancels the previous run instead of queueing
# behind it. Tag pushes are not a UI change.
concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, microservices, 'feat/**']
    paths:
      - 'services/ui/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    paths:
      - 'services/ui/**'
      - '.github/workflows/ui-tests.yml'

jobs:
  # The checks run side by side. The unit suite ran on one runner for ~6
  # minutes, which made it the whole workflow's critical path, so it is split
  # in four. Lint and typecheck share a runner, one after the other: with
  # node_modules restored from the cache each takes about a minute, inside the
  # unit shards' time, and that is two runners fewer queueing behind the
  # 20-runner limit (the split needed a third job just to report this name).
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # node_modules itself, keyed on the lockfile: `npm ci` from the npm cache
    # still took ~50 s a job (it unpacks and links every package again).
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: services/ui/node_modules
        key: ui-node-modules-${{ runner.os }}-latest-node22-${{ hashFiles('services/ui/package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      working-directory: services/ui
      run: npm ci

    - name: Run Lint
      working-directory: services/ui
      run: npm run lint

    # The root tsconfig only references the real configs ("files": []), so
    # plain `tsc -p .` checks nothing, and the Vite build strips types without
    # checking them. This is the step that actually typechecks the UI.
    - name: Typecheck
      if: ${{ !cancelled() }}
      working-directory: services/ui
      run: npm run typecheck

  # The same suite (`npm run test` = `vitest run`), split by file across four
  # runners. Vitest's --shard takes every Nth test file, so each test runs in
  # exactly one shard and the four together are the whole suite.
  unit-tests-shard:
    name: unit-tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # node_modules itself, keyed on the lockfile: `npm ci` from the npm cache
    # still took ~50 s a job (it unpacks and links every package again).
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: services/ui/node_modules
        key: ui-node-modules-${{ runner.os }}-latest-node22-${{ hashFiles('services/ui/package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      working-directory: services/ui
      run: npm ci

    - name: Run Unit Tests (shard ${{ matrix.shard }} of 4)
      working-directory: services/ui
      run: npm run test -- --shard=${{ matrix.shard }}/4

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # node_modules itself, keyed on the lockfile: `npm ci` from the npm cache
    # still took ~50 s a job (it unpacks and links every package again).
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: services/ui/node_modules
        key: ui-node-modules-${{ runner.os }}-latest-node22-${{ hashFiles('services/ui/package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      working-directory: services/ui
      run: npm ci

    - name: Build
      working-directory: services/ui
      run: npm run build

  # The check name this workflow had before the split, so anything that waits
  # on "unit-tests" still sees one result. It passes only when every shard did.
  unit-tests:
    needs: unit-tests-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every unit-test shard passed
      run: test "${{ needs.unit-tests-shard.result }}" = "success"
