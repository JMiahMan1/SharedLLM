name: Windows Guard Build

on:
  push:
    branches: [ main, microservices ]
    paths:
      - 'agent/jarvis-guard/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [ main, microservices ]
    paths:
      - 'agent/jarvis-guard/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-guard:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # The Core logic (offline rules, lock enforcement, config parsing) is
    # plain net10.0 and tested here before anything is built for a family PC.
    - name: Test the guard's core logic
      run: dotnet test agent/jarvis-guard/tests/JarvisGuard.Core.Tests.csproj -c Release

    - name: Publish jarvis-guard.exe
      run: dotnet publish agent/jarvis-guard/jarvis-guard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o dist/

    - name: Verify the exe exists and is a PE binary
      shell: bash
      run: |
        ls -la dist/jarvis-guard.exe
        size=$(stat -c%s dist/jarvis-guard.exe)
        if [ "$size" -lt 1000000 ]; then
          echo "::error::jarvis-guard.exe is only $size bytes; refusing to keep it."
          exit 1
        fi
        head -c 2 dist/jarvis-guard.exe | od -An -tx1 | grep -qi '^ *4d *5a' || {
          echo "::error::jarvis-guard.exe does not start with the MZ header."
          exit 1
        }
        echo "[OK] dist/jarvis-guard.exe ($size bytes) is a PE binary."
        # The installer and uninstaller travel with the exe: a parent downloads
        # one zip, unpacks it, and runs install.ps1 from that folder.
        cp agent/jarvis-guard/install.ps1 agent/jarvis-guard/uninstall.ps1 agent/jarvis-guard/README.md dist/
        (cd dist && sha256sum jarvis-guard.exe | tee jarvis-guard.exe.sha256)

    - name: Build the Setup.exe
      shell: bash
      run: |
        # One version for the whole product: the APK and both Windows assets land
        # in the same release, so the tag is read from services/ui/package.json.
        VERSION=$(python3 -c "import json;print(json.load(open('services/ui/package.json'))['version'])")
        choco install innosetup --no-progress -y >/dev/null
        ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
        [ -x "$ISCC" ] || ISCC="/c/Program Files/Inno Setup 6/ISCC.exe"
        "$ISCC" /DAppVersion="$VERSION" /DSourceDir="$GITHUB_WORKSPACE\\dist" agent/jarvis-guard/installer/jarvis-guard.iss
        SETUP="agent/jarvis-guard/installer/output/JarvisGuard-Setup-$VERSION.exe"
        ls -la "$SETUP"
        size=$(stat -c%s "$SETUP")
        if [ "$size" -lt 1000000 ]; then
          echo "::error::The installer is only $size bytes; refusing to publish it."
          exit 1
        fi
        sha256sum "$SETUP" | tee "$SETUP.sha256"
        echo "[OK] $SETUP ($size bytes)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-guard-windows
        path: |
          dist/jarvis-guard.exe
          dist/jarvis-guard.exe.sha256
          dist/install.ps1
          dist/uninstall.ps1
          dist/README.md
          agent/jarvis-guard/installer/output/JarvisGuard-Setup-*.exe
          agent/jarvis-guard/installer/output/JarvisGuard-Setup-*.exe.sha256
        retention-days: 30

    # Mirror of the Android APK publish step: the exe lands in
    # data/app_updates/next to jarvis-os.apk. Skipped on pull requests.
    - name: Publish exe to the hub
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        PUBLISH_URL: ${{ secrets.WINDOWS_PUBLISH_URL }}
        INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        GIT_SHA: ${{ github.sha }}
      run: |
        if [ -z "$PUBLISH_URL" ] || [ -z "$INTERNAL_SECRET" ]; then
          echo "::notice::WINDOWS_PUBLISH_URL / INTERNAL_SECRET not configured; skipping publish."
          echo "::notice::The exe is still available as the jarvis-guard-windows artifact."
          exit 0
        fi
        VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/jarvis-guard/jarvis-guard.csproj | head -1)
        HTTP=""
        # Same retry semantics as the APK publish: the publish can land on a
        # gateway that is mid-restart when a deploy just finished, so retry
        # the transient statuses instead of throwing the whole build away.
        for attempt in 1 2 3 4 5; do
          HTTP=$(curl -sS --max-time 600 -o publish-response.json -w '%{http_code}' \
            -H "X-Internal-Secret: $INTERNAL_SECRET" \
            -F "exe=@dist/jarvis-guard.exe" \
            -F "version=$VERSION" \
            -F "git_sha=$GIT_SHA" \
            -F "release_notes=Jarvis Guard agent build ${GIT_SHA:0:8}" \
            "$PUBLISH_URL") || HTTP="000"
          if [ "$HTTP" = "200" ]; then
            break
          fi
          case "$HTTP" in
            000|502|503|504)
              if [ "$attempt" = "5" ]; then
                break
              fi
              echo "::warning::Publish attempt $attempt got HTTP $HTTP (the server is probably restarting); retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
              ;;
            *)
              break
              ;;
          esac
        done
        cat publish-response.json 2>/dev/null || true
        echo
        if [ "$HTTP" = "413" ]; then
          echo "::error::The proxy in front of the server rejected the exe (HTTP 413)."
          echo "::error::Raise the request body limit on the nginx that fronts the domain"
          echo "::error::(add \`client_max_body_size 64m;\` to its server{} block, then reload nginx)."
          exit 1
        fi
        if [ "$HTTP" != "200" ]; then
          echo "::error::Publish failed with HTTP $HTTP"
          exit 1
        fi
        echo "[OK] Published jarvis-guard build ${GIT_SHA:0:8}."

    # The Releases page is where a parent looks for a Windows download. Until now
    # the exe only existed as a 30-day workflow artifact, which is why there was
    # nothing to install from GitHub.
    - name: Publish to the GitHub release
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(python3 -c "import json;print(json.load(open('services/ui/package.json'))['version'])")
        SETUP="agent/jarvis-guard/installer/output/JarvisGuard-Setup-$VERSION.exe"
        gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "Jarvis $VERSION" --generate-notes
        gh release upload "v$VERSION" dist/jarvis-guard.exe dist/jarvis-guard.exe.sha256 "$SETUP" "$SETUP.sha256" --clobber
        echo "[OK] v$VERSION now carries jarvis-guard.exe and $(basename "$SETUP")."
