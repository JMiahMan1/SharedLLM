name: SOA Microservices CI

on:
  push:
    branches: [ main, master, microservices ]
    paths:
      - 'services/**'
      - '!services/ui/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/soa_tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'services/**'
      - '!services/ui/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/soa_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    # No `env:` block on purpose.
    #
    # conftest.py's _TEST_ENV_DEFAULTS is now the single source of truth for
    # every env var services/config.py reads, so a developer's .env and a CI
    # runner see identical values. This workflow used to export 27 of them
    # itself, which meant CI and local runs exercised *different* configuration
    # and could not fail the same way. Anything a service genuinely needs at
    # runtime belongs in conftest, not here.

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-asyncio respx anyio httpx fastapi uvicorn sqlmodel cryptography pydantic requests ruff mypy
        # We install dummy packages for chromadb and sentence-transformers to run tests
        # without downloading heavy machine learning models on GitHub actions runners.
        # But since our tests mock these heavy deps, we only need the API contracts.

    - name: Install service dependencies
      run: |
        pip install -r services/identity/requirements.txt
        pip install -r services/execution/requirements.txt
        pip install -r services/gateway/requirements.txt
        pip install -r services/storage/requirements.txt
        pip install -r services/automation/requirements.txt
        pip install -r services/telemetry/requirements.txt
        # RAG has huge deps (Torch), so we mock it for CI unit tests
        # The tests are designed to bypass heavy ML loads via mocker.

    - name: Lint (ruff + full-suite collection fast-fail)
      run: |
        # Fast static gate that runs BEFORE the heavier pytest run.
        # ruff catches syntax errors and undefined names within a file.
        # pytest --collect-only imports every test module in the suite (and thus
        # the whole service import graph) without executing tests, surfacing
        # ImportError / missing re-export breakage immediately instead of
        # mid-collection in the test step. This used to be hardcoded to 13 named
        # files, so a broken import in any of the other ~90 test modules was
        # invisible until someone ran the suite locally.
        ruff check --select E9,F63,F7,F82 services/gateway
        pytest --collect-only -q

    - name: Run Pytest
      run: |
        # The whole suite, not a 13-file sample. Excludes only the markers that
        # genuinely need live infrastructure: local_only (live Home Assistant /
        # Nextcloud) and server_only (a running service mesh).
        pytest \
          -m "not local_only and not server_only" \
          --junitxml=pytest-report.xml \
          --cov=services/ \
          --cov-report=xml

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-results
        path: pytest-report.xml
