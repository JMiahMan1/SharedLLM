name: SOA Microservices CI

# One run per branch, newest wins. A push used to leave the previous run
# finishing its 24 minutes while the new one queued behind it, so the answer
# people waited for was about code that had already been replaced.
concurrency:
  group: soa-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master, microservices ]
    paths:
      - 'services/**'
      - '!services/ui/**'
      - 'conftest.py'
      - 'pytest.ini'
      - '.github/workflows/soa_tests.yml'
  pull_request:
    # microservices too: every change reaches it by pull request, and without this
    # a test broken by one only showed on the push after the merge.
    branches: [ main, master, microservices ]
    paths:
      - 'services/**'
      - '!services/ui/**'
      - 'conftest.py'
      - 'pytest.ini'
      - '.github/workflows/soa_tests.yml'

jobs:
  # Static gate, on its own runner: it used to run first inside the single job,
  # so every test waited for pip to install eight service requirement sets
  # before anyone learned there was a syntax error.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    # No `env:` block on purpose: conftest.py's _TEST_ENV_DEFAULTS is the single
    # source of truth for every value services/config.py reads, so a developer's
    # .env and a CI runner see identical configuration.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-split "fakeredis[lua]" respx anyio httpx fastapi uvicorn sqlmodel cryptography pydantic requests ruff mypy
        # Heavy ML packages (fastembed models, torch) are not installed here:
        # the tests mock them, so only the API contracts are needed.

    - name: Install service dependencies
      run: |
        pip install -r services/identity/requirements.txt
        pip install -r services/execution/requirements.txt
        pip install -r services/gateway/requirements.txt
        pip install -r services/storage/requirements.txt
        pip install -r services/bible/requirements.txt
        pip install -r services/health/requirements.txt
        pip install -r services/automation/requirements.txt
        pip install -r services/telemetry/requirements.txt
        pip install -r services/homehub/requirements.txt
        # RAG has huge deps (Torch), so we mock it for CI unit tests.

    - name: Ruff (syntax and undefined names)
      run: ruff check --select E9,F63,F7,F82 services/gateway services/garden services/execution

    # pytest --collect-only imports every test module (and thus the whole service
    # import graph) without running a test, so a broken import fails here in a
    # minute instead of mid-collection in the shards below.
    - name: Import every test module
      run: pytest --collect-only -q

  # Six shards, all at once, balanced by run time from the committed
  # .test_durations (without it pytest-split split by test COUNT, and the shard
  # that drew test_ma_ws_client and the bible API ran 426 s of tests against
  # another's 64 s). Tests missing from the file count as the average, so a
  # stale file only unbalances, never skips. Refresh it from a green run's
  # junit artifacts: scripts/ci_test_durations.py <run-id>.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    # No `env:` block on purpose: conftest.py's _TEST_ENV_DEFAULTS is the single
    # source of truth for every value services/config.py reads, so a developer's
    # .env and a CI runner see identical configuration.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-split "fakeredis[lua]" respx anyio httpx fastapi uvicorn sqlmodel cryptography pydantic requests ruff mypy
        # Heavy ML packages (fastembed models, torch) are not installed here:
        # the tests mock them, so only the API contracts are needed.

    - name: Install service dependencies
      run: |
        pip install -r services/identity/requirements.txt
        pip install -r services/execution/requirements.txt
        pip install -r services/gateway/requirements.txt
        pip install -r services/storage/requirements.txt
        pip install -r services/bible/requirements.txt
        pip install -r services/health/requirements.txt
        pip install -r services/automation/requirements.txt
        pip install -r services/telemetry/requirements.txt
        pip install -r services/homehub/requirements.txt
        # RAG has huge deps (Torch), so we mock it for CI unit tests.

    - name: Run Pytest (shard ${{ matrix.shard }} of 6)
      env:
        # Opt in to tests/integration (conftest.py skips it otherwise). Safe
        # here: a runner has no .env, no SERVER_IP and no route to a deployed
        # stack, so those tests run only their hermetic parts.
        SHAREDLLM_RUN_LIVE: "1"
        # One data file per shard, so the coverage job can combine them.
        COVERAGE_FILE: .coverage.${{ matrix.shard }}
      run: |
        # Excludes only the markers that genuinely need live infrastructure:
        # local_only (live Home Assistant / Nextcloud) and server_only (a
        # running service mesh).
        pytest           -m "not local_only and not server_only"           --splits 6 --group ${{ matrix.shard }}           --junitxml=pytest-report-${{ matrix.shard }}.xml           --cov=services/           --cov-report=xml:coverage-${{ matrix.shard }}.xml

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.shard }}
        include-hidden-files: true
        path: |
          coverage-${{ matrix.shard }}.xml
          .coverage.${{ matrix.shard }}

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-results-${{ matrix.shard }}
        path: pytest-report-${{ matrix.shard }}.xml

  # One coverage figure for the whole suite: each shard covers only its slice.
  coverage:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Download shard coverage
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-report-*
        merge-multiple: true

    - name: Combine
      run: |
        pip install coverage
        coverage combine .coverage.*
        coverage xml -o coverage.xml
        coverage report --format=total | xargs -I{} echo "Total coverage: {}%" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload combined coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-combined
        path: coverage.xml
