<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA Stream Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; min-height: 100vh; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
        label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.25rem; }
        input[type="text"] { width: 100%; padding: 0.5rem; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #e2e8f0; font-size: 0.875rem; }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        button { padding: 0.5rem 1rem; border-radius: 4px; border: none; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
        button.primary { background: #0284c7; color: white; }
        button.primary:hover { background: #0369a1; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .status { padding: 0.75rem; border-radius: 4px; font-size: 0.875rem; margin-top: 0.75rem; }
        .status.info { background: #0c4a6e; border: 1px solid #0284c7; }
        .status.success { background: #052e16; border: 1px solid #16a34a; color: #4ade80; }
        .status.error { background: #450a0a; border: 1px solid #dc2626; color: #f87171; }
        .status.warn { background: #422006; border: 1px solid #d97706; color: #fbbf24; }
        #log { max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; line-height: 1.6; padding: 0.75rem; background: #020617; border-radius: 4px; }
        #log .log-entry { padding: 2px 0; border-bottom: 1px solid #1e293b; }
        #log .log-time { color: #64748b; }
        #log .log-info { color: #38bdf8; }
        #log .log-error { color: #f87171; }
        #log .log-success { color: #4ade80; }
        #log .log-warn { color: #fbbf24; }
        #audio-container { margin-top: 1rem; }
        audio { width: 100%; max-width: 600px; }
        .result { margin-top: 0.5rem; font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>
    <h1>MA Stream Test</h1>

    <div class="card">
        <label for="uri">MA URI</label>
        <input type="text" id="uri" placeholder="youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        
        <div class="controls" style="margin-top: 1rem;">
            <button class="primary" id="btn-resolve">Resolve Stream URL</button>
            <button class="primary" id="btn-play" disabled>Play</button>
            <button class="primary" id="btn-stop" disabled>Stop</button>
        </div>

        <div class="result" id="result"></div>

        <div id="status-container"></div>

        <div id="audio-container">
            <audio id="audio-player" controls></audio>
        </div>
    </div>

    <div class="card">
        <h2 style="font-size: 1rem; color: #94a3b8; margin-bottom: 0.75rem;">Log</h2>
        <div id="log"></div>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const statusContainer = document.getElementById('status-container');
        const audioPlayer = document.getElementById('audio-player');
        const btnResolve = document.getElementById('btn-resolve');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const resultEl = document.getElementById('result');
        const uriInput = document.getElementById('uri');

        let streamUrl = null;

        function log(msg, type = 'info') {
            const time = new Date().toISOString().split('T')[1].slice(0, -1);
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(msg, type = 'info') {
            statusContainer.innerHTML = `<div class="status ${type}">${msg}</div>`;
        }

        async function resolveStream() {
            const uri = uriInput.value.trim();
            if (!uri) {
                log('URI is required', 'error');
                return;
            }

            btnResolve.disabled = true;
            log(`Resolving stream URL for: ${uri}`);

            try {
                // Get API token from localStorage
                const token = localStorage.getItem('jarvis_api_key');
                if (!token) {
                    log('No API token found in localStorage. Login to the UI first.', 'warn');
                }

                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const resp = await fetch(`/api/media/stream/music-assistant?uri=${encodeURIComponent(uri)}`, {
                    method: 'GET',
                    headers,
                });

                if (!resp.ok) {
                    const text = await resp.text();
                    log(`HTTP ${resp.status}: ${text}`, 'error');
                    setStatus(`Error: ${resp.status} - ${text}`, 'error');
                    log('Stream resolution failed', 'error');
                    return;
                }

                const data = await resp.json();
                streamUrl = data.stream_url;

                if (streamUrl) {
                    log(`Stream URL resolved: ${streamUrl.substring(0, 120)}...`, 'success');
                    setStatus(`Stream URL resolved successfully`, 'success');
                    resultEl.textContent = `Stream URL: ${streamUrl.substring(0, 80)}...`;
                    btnPlay.disabled = false;
                } else {
                    log('No stream URL in response', 'error');
                    setStatus('No stream URL in response', 'error');
                    log('Stream resolution failed', 'error');
                }
            } catch (err) {
                log(`Resolve error: ${err.message}`, 'error');
                setStatus(`Error: ${err.message}`, 'error');
            } finally {
                btnResolve.disabled = false;
            }
        }

        function playStream() {
            if (!streamUrl) {
                log('No stream URL to play', 'warn');
                return;
            }

            log(`Playing stream: ${streamUrl.substring(0, 120)}...`, 'info');
            audioPlayer.src = streamUrl;
            audioPlayer.play().then(() => {
                log('Audio playback started', 'success');
                btnPlay.disabled = true;
                btnStop.disabled = false;
            }).catch(err => {
                log(`Playback error: ${err.message}`, 'error');
                setStatus(`Playback error: ${err.message}`, 'error');
            });
        }

        function stopStream() {
            log('Stopping playback', 'info');
            audioPlayer.pause();
            audioPlayer.src = '';
            btnPlay.disabled = false;
            btnStop.disabled = true;
        }

        // Event listeners
        btnResolve.addEventListener('click', resolveStream);
        btnPlay.addEventListener('click', playStream);
        btnStop.addEventListener('click', stopStream);

        // Audio event listeners
        audioPlayer.addEventListener('playing', () => log('Audio: playing', 'success'));
        audioPlayer.addEventListener('pause', () => log('Audio: paused', 'info'));
        audioPlayer.addEventListener('error', (e) => {
            const err = audioPlayer.error;
            log(`Audio error: code=${err?.code || 'unknown'}, message=${err?.message || 'unknown'}`, 'error');
            setStatus(`Audio error: ${err?.message || 'unknown'}`, 'error');
        });
        audioPlayer.addEventListener('waiting', () => log('Audio: buffering...', 'warn'));
        audioPlayer.addEventListener('canplay', () => log('Audio: ready to play', 'success'));

        // Log page load
        log('MA Stream Test page loaded', 'info');
        log(`Base URL: ${window.location.origin}`, 'info');
    </script>
</body>
</html>
