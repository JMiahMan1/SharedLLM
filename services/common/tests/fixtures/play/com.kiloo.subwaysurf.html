<script nonce="x">AF_initDataCallback({key: 'ds:10', hash: '10', data:[[["review-0",["A Google user",null],2,null,"Came back to the game after 5 yrs - As far as game play, I do enjoy it overall as it's a nice simple time killer. I have noticed, however, that the game has become way too crowded with too much happening on the menu page and way too many ads. Also I'm not sure who the creators are but it seems like they just chose Black stereotypes to go with whether it's basketball player, jazz musician, or boom box carrier. Could've been way more creative like how the other characters are.",[1789071465,548000000],1110,null,null,null,"3.68.5",null,null,null,null,null,null],["review-1",["A Google user",null],4,null,"always has been a good game and always will be. only problem id say is the fact that you CANNOT get some skins or outfits unless you pay a 10$ microtranscation. I get the company needs money but I'm sure there's some other way to go about it rather than locking outfits behind a paywall that would be cool to collect otherwise. besides that, there's lots of cheaters but they don't necessarily effect you. they just show up on top run leaderboards sometimes and impossible to beat. great game though.",[1780292737,459000000],55,null,null,null,"3.63.1",null,null,null,null,null,null],["review-2",["A Google user",null],5,null,"I played \"Subway Surfer\" 10 years ago. It was fun then. It was more difficult to play at first. I was able to get about 6 characters. You have really updated the game quite a bit. I really like the changes. Some things i am getting used to. I have to figure out how to do some things. It is really a variation on a theme. I wish i was good enough to win the Top 2 characters. The Woman from African or Carribean decent and the Man from the Middle East. \"Congratulations\" on 10 years strong!!",[1649658453,385000000],23,null,null,null,"2.32.0",null,null,null,null,null,null],["review-3",["A Google user",null],4,null,"I love the game!!! Very addicting and requires focus and hand cordination. The only thing I will complain about is that I played a while ago and I got really good, and got a bunch of stuff, and then I deleted it to free up space. I just got back on almost a year later and it asked if I wanted to get my progress back. I did and it barley has any of my stuff, none of the characters (except for the main one) are unlocked and none of my progress is there. Other than that I suggest getting this game!",[1583788837,290000000],2,null,null,null,"1.115.0",null,null,null,null,null,null],["review-4",["A Google user",null],4,null,"I love the game, however, I'm not a fan of how many items you need to unlock other surfers or their power ups etc. Ex. I need 250 alien ships to unlock that power up but they only come around once in a while. It's annoying. Overall, like the game and graphics. It'd be cool if we could pick what part of the world we wanted to run in just as we pick who to use as our runners.",[1556388544,484000000],531,null,null,null,"1.102.0",null,null,null,null,null,null],["review-5",["A Google user",null],4,null,"It's a very fun game! It's okay and all but I could personally have some issues with the game. 1.when I have good internet and I want to watch an ad for mystery boxes it says \"no connection\" 2.the movements are too slow. I could try to roll but it would go too late And 3. The characters are way too expensive. For example I would have to pay 30k coins for one character although its just the same as all the others it jumps, rolls and, runs. There may be typos because this isn't my first language",[1611801057,241000000],10,null,null,null,null,null,null,null,null,null,null],["review-6",["A Google user",null],5,null,"I love it! It's a great mobile game. But the characters cost so much! But there's so many new features it feels like every month. Anytime I'm bored, I'll just play this. It entertains me for a while. Or it does not save my progress. But this game is a little hard. I think they should fix these glitches, cause there OP. But I normally play normal, or a few glitches. But besides. This game is perfect to entertain you!",[1654195295,692000000],248,null,null,null,"2.34.0",null,null,null,null,null,null],["review-7",["A Google user",null],5,null,"This game is great but I'm wondering why you renamed frizzy to Ella? Or was her name always ella. I don't know if it was always this or not.im curious Anyways I have no problems with this game but say you use a key to save a life so you can run more. Then there is a train on the side of you and in front of you. Like you can't move anywhere and is forced to run into the train. I mean sure you can just double tap to keep on running but it will be helpful if this sort of thing was fixed it a bit.",[1609415346,375000000],6,null,null,null,"2.10.2",null,null,null,null,null,null],["review-8",["A Google user",null],4,null,"I really love this game, its entertaining, is very inclusive for different areas, and has a multitude of characters with all sorts of backgrounds. However, while I do love the style in the game, a lot of the special characters are in bundle packs which you have to buy. For the Day of the Dead month, I really wanted a few of them, but they were only able to be bought with actual money, which is disappointing. While I understand buying keys, buying characters makes them unattainable to some.",[1667328848,32000000],6289,null,null,null,"3.3.0",null,null,null,null,null,null],["review-9",["A Google user",null],5,null,"Me and my young Grand clildren (9 & 6) still love \"SUBWAY SURFER\" even after 2+ years ! It really is a lotta fun !Very good game ! Interesting, re-news often, works/operates well, fairly easy. My only complaint is that you cannot log on, play, continuously from one device to another. If you get a new device, you must start all over from the beginning.",[1652793250,572000000],597,null,null,null,"2.34.0",null,null,null,null,null,null],["review-10",["A Google user",null],4,null,"The reason I am giving my (what used to be) favorite game that I've grown up with a 4 is because when I was playing for a few minutes then decided to take a break to grab something to eat. A few a hours later I come back and the 3 keys I got from watching an ad disappeared plus another that I got from a run. Seriously, I had 59 keys now I have 55. Who ever is reading my review is probably rolling their eyes but you probably wouldn't get it since I didn't cheat, in other words pay for the keys.",[1561525741,78000000],0,null,null,null,null,null,null,null,null,null,null],["review-11",["A Google user",null],4,null,"Great time killer, I love the daily challenges and all the different characters. Update: I stopped playing this game for several years and just picked it up again. It's still a fun game, however I had to remove a star. It had lost all my saved data and all the characters and hoverboards I bought years ago. Also now when I drop from the sky after earning a boost it keeps dropping me on barriers that kills me. I haven't found a way to avoid this and it keeps happening.",[1611198765,809000000],1,null,null,null,"2.11.0",null,null,null,null,null,null],["review-12",["A Google user",null],5,null,"So Addicted. I've been playing this game basically since it came out. With each update the game just gets better and better. I like how you can log in with social media and continue your progress and keep your characters. There are ads but not pop up ads like other games and you can use them to your advantage. It's a game I can play with my kids and enjoy together without spending too much and paying for every little thing. We look forward to each season and the new themes and characters.",[1678686194,191000000],2,null,null,null,"3.8.2",null,null,null,null,null,null],["review-13",["A Google user",null],4,null,"Okay...I've played this game for a while when I was younger and it has changed A LOT. There are less ads which I appreciate but there is something that I find a little annoying...I know that the pop ups that u can buy is a way to promote the game(Ex: Offering a Character)but everytime I get one, like 3 more pop up! After that I get an amount of ads and I haven't even played yet!? Overall, it's good but that was my only complaint.",[1658424221,969000000],7236,null,null,null,"2.37.0",null,null,null,null,null,null],["review-14",["A Google user",null],5,null,"This game is a great pastime, with no intrusive ads and optional ads that actually give you the rewards that is worth spending the 30 seconds for. The updates are regular and there's surprisingly a lot to do in a game that looks rather simple. The gameplay is rather well known so I won't go too far into it, just that the simple concept of it might just be what you need to de stress. It's unfortunately rare to find many good \"free-to-play\" games these days but Subway Surfers gets it right.",[1667376529,300000000],18,null,null,null,null,null,null,null,null,null,null],["review-15",["A Google user",null],5,null,"I love this game. It does get repetitive but you must focus on the missions, and the achievements. Also, focus on getting the characters that give you the highest points, like Zayn. And make sure to buy the monster board and upgrading this board to the add-ons. Buy all the upgrades too. I upgraded everything as i collect more coins, but i prioritized the sneaker because its the most useful to doging trains and barriers. Good luck.",[1615503049,518000000],1,null,null,null,"2.13.5",null,null,null,null,null,null],["review-16",["A Google user",null],5,null,"I love the the game. You can collect an unlimited amount of coins collenct lots and lots of characters. Challange yourself to amazing jumps and roll under barriers. And see how far you get. My high score is 1,811,0486. See if you can beat it. This is one hell of an app for sure. One of the best games I have ever played in years. You should really try this app. And I forgot you can also collect blue keys. That can get you better rewards like exclusive characters and different hoverboards. GET IT!",[1651625477,656000000],5913,null,null,null,"2.33.0",null,null,null,null,null,null],["review-17",["A Google user",null],4,null,"it's a great game TBH. It has some things that give it a 4 in stead of a 5, here are some reasons. #1 I will try to swipe a certain way up, down, left, right, and it won't work sometimes. #2 the flamingos that you try to get will sometimes be in spots you can't reach at all. like on top of a building where no one can reach. Other than those 2 reasons it's a good game.",[1562425704,811000000],203,null,null,null,"1.105.0",null,null,null,null,null,null],["review-18",["A Google user",null],4,null,"When it comes to graphics, the style is cartoon like and fun. The visuals aren't too overwhelming, making for a simple and good looking experience. When it comes to the animations, it seems fun and exciting. Until, that is, you get a new character and realize all the characters are carbon copies of each other in both gameplay and animations. Once you start playing for a while and start getting used to the animations, you may notice some inconsistencies. For example, if you get a jump boost powerup (not to be confused with the double jump) and it ends while you are on the ground, the bounce walking animation will continue to play until you do something. The music is ok at first, but quickly gets annoying, so I would recommend muting the game. The gameplay feels natural; up to jump, left and right to move, down to roll. The only real issue I have with the gameplay is the hoverboards. To activate the hoverboard, you must double tap the screen. This, of course, can happen by complete accident with your thumbs so close to the screen. The powerups don't get in the way, and feel satisfying to grab and use. While playing, you can complete missions to boost your score. At first glance, this seems like a good idea, but gets old fast. Some missions are things you may complete on accident, such as rolling fourty times. Others are just a waste of time, not out of challenge, but out of a challenge supplement: waiting. I currently have a mission that says I have to complete four word hunts. For those of you who don't know, a word hunt is just that, a hunt for letters to make a word that rewards the player afterwards, usually with coins, mystery boxes, and hoverboards. The thing is, word hunts only happen once a day, meaning I have to play for four days just for one score boost. One could argue that I could pay coins to skip it, but that's just cheap. Overall, the game is ok, but could definitely use some improvements.",[1537111057,711000000],7,null,null,null,null,null,null,null,null,null,null],["review-19",["A Google user",null],5,null,"Absolutely great game! It's free, but it's in no way a \"pay-to-win\". There's always something new to do, so even with game play that is simple you never get bored. No powerups or anything relevant to game play is unaccessable by a pay wall, and it's quite reasonable to obtain them. The game does a good job of rewarding you according to your skill level, so no matter if you're better or worse at the game, you'll always feel successful and want to improve. Great graphics, runs well, recommended=]",[1652834834,558000000],823,null,null,null,"2.34.0",null,null,null,null,null,null]],[null,"CrMBIqoBARqIumjzF2FT7-vRn5rT2lhkOPlj22Sg898M4Eo99X9WeFIAj1FwewnB8LOcDUvlVq59GwGpRwOGAA4Y9MOh-EISsN-CQf3JZLW1CLuAehlJ2vQAJ5tQyFntX94RjT-Xe1Y9Xz_aO0Xi7JyYQQLQbRCS4KIMAa4wNufWUxTU2_qZiw35-r-O7gZ5WH-IXw62-WGkbsDmh43kinKCxhVyrotjI2-G9MKpX7Uo_qfo1wY"],[[null,[[1800],null,[72000]]]]], sideChannel: {}});</script>
