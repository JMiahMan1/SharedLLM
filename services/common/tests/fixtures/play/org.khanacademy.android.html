Mountain View, CA 94041\nUnited States"],"+1 877-393-8168"]],null,null,[[null,"You can learn anything. For free.<br><br>Spend an afternoon brushing up on statistics. Discover how the Krebs cycle works. Get a head start on next semester&#39;s geometry. Prepare for upcoming exams. Or, if you&#39;re feeling particularly adventurous, learn how fire-stick farming changes the landscape of Australia.<br><br>Whether you&#39;re a student, teacher, homeschooler, principal, adult returning to the classroom after 20 years, or a friendly alien trying to get a leg up in earthly biology — Khan Academy&#39;s personalized learning library is available to you, for free.<br><br>- Learn anything, for free: Thousands of interactive exercises, videos, and articles at your fingertips. Study math, science, economics, finance, grammar, history, government, politics, and much, much more.<br><br>- Sharpen your skills: Practice exercises, quizzes, and tests with instant feedback and step-by-step hints. Follow along with what you&#39;re learning in school, or practice at your own pace.<br><br>- Keep learning when you&#39;re offline: Bookmark and download your favorite content to watch videos without an internet connection.<br><br>- Pick up where you left off: Tailored to your current learning level, our mastery system gives instant feedback and recommendations on exactly which skills and videos to try next. And, if you choose to create a free account, your learning syncs with http://khanacademy.org, so your progress is always up-to-date across all your devices. <br><br>Learn using expert-created videos, interactive exercises, and in-depth articles in math (arithmetic, pre-algebra, algebra, geometry, trigonometry, statistics, calculus, differential equations, linear algebra), science (biology, chemistry, physics), economics (microeconomics, macroeconomics, finance and capital markets), humanities (art history, civics, finance, US history, US government and politics, world history), and more (including computer science principles)!<br><br>Already familiar with the Khan Academy website? Not all functionality is available in this app. Community discussions, computer programming content, test prep, parent tools, teacher tools, and district tools should all be accessed directly at http://khanacademy.org.<br><br>Khan Academy is a 501(c)(3) nonprofit organization, with the mission of providing a free, world-class education for anyone, anywhere."]],[[null,"You can learn anything."]],[null,null,[[["Phone",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/QDYtvjtZon4TYi4-wkvfIqszmmJL258051XdtozjpIZVH-8zVoay1oBS9vw7lzDYYaDz48AzxmOY040lNqc"]],[[null,"read phone status and identity"]],["phone"]],["Photos/Media/Files",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/pHtIujPWxciAZcfYSwlrGGq14Z984rKLMgcm9RPATLiOlbrWy-tVlelEWgED7gpktgcD1tZizVeHiO5fkw"]],[[null,"read the contents of your USB storage"],[null,"modify or delete the contents of your USB storage"]],["perm_media"]],["Storage",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/aWNKQedLTpw6u6yyMjQObmuoKu67A1czWnIcvID86oAmMT02r5mNdRn6l9ZN2t2MIyH6tNy-01v7ukeQ"]],[[null,"read the contents of your USB storage"],[null,"modify or delete the contents of your USB storage"]],["storage"]],["Camera",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/xbP_oGuJ21iG29iVh0p-UIZPzi_fYj8PMYiqDd9-LvaZ_a1tRcwp0I2-arfXvgX9YtfZTTaqwcLRWPNQM_c"]],[[null,"take pictures and videos"]],["camera"]],["Wi-Fi connection information",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/U-_SG8pHTsqU_IyZTGQRkVMdLaAUeq1OnKGrB06KHF1z7vkkIQK3iF0HcbfTe1RnGlh-ajnZkbphl2W3Gdk"]],[[null,"view Wi-Fi connections"]],["signal_wifi_4_bar"]],["Device ID & call information",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/l2htRLV5Mt-RZ6nroJCXy3OF_CqdntOsEetnLEjH1wC-WJWV00R5orcBWj0NMFKJVEQU6JhPYRBCKnj3_Q"]],[[null,"read phone status and identity"]],["perm_device_information"]]],[["Other",[ <script nonce="x">AF_initDataCallback({key: 'ds:10', hash: '9', data:[[["review-0",["A Google user",null],5,null,"It's great. I am using it to brush up on Grammer for my field of work but I found much more. Upon exploration, I found useful learning concepts for both my children and myself in mathematics, history, science, arts and humanities. After going through a few videos, I see that they focus on multiple learning styles. Each video has traits of visual, read/wright, and auditory. After the video, they provide quizzes for hands on. It's an amazing resource for anyone wanting to learn.",[1553912753,60000000],90,null,null,null,"5.2.5",null,null,null,null,null,null],["review-1",["A Google user",null],3,null,"I like it, especially if helping me relearn math I forgot. Unfortunately, it's extremely buggy and actually makes me really angry to have to deal with it so often. Sometimes when I leave a math exercise and come back later, none of the exercises load for the longest time. This wasn't a problem when I started using this app back in October, what the hell did you guys do to it? Also, can't use a hint during a quiz or unit test without it crashing. Please fix these issues because it's really difficult and frustrating to deal with.",[1545099219,628000000],56,null,null,null,"5.2.3",null,null,null,null,null,null],["review-2",["A Google user",null],5,null,"Great app of course, this is free education so I can't complain about that. The computer version is much better and easier to navigate however. I have a lot of difficulty entering answers into the quiz on the mobile version for Algebra. So I find myself redoing problems to try and get a better score. So if you have access to a computer I think you'd get more out of the course but nonetheless this is a good app overall.",[1617971852,304000000],73,null,null,null,"7.2.0",null,null,null,null,null,null],["review-3",["A Google user",null],5,null,"Khan academy/the people/videos/tests are all incredible. Everyones voices are very pleasant,the videos and explanations are quick(much appreciated),as well as very informative and really drives the point home explaining in it several different ways, so it's easily understood, and memorable. The little test along the way really help make sure you understand too. I was ecstatic when I finally completely understood how to solve an algebraic equation! That's never happened before! So thank you!",[1668813396,860000000],149,null,null,null,"7.6.1",null,null,null,null,null,null],["review-4",["A Google user",null],4,null,"So far so good. Brushing up and refreshing my memory on topics I studied when I was younger. One thing I like is the game aspect of it. You get rewarded when completing the lessons. One thing I would like for you guys to add is a green check mark on the course icon when a course is 100% complete. On the app, if you look at the course list, there's no indicator on which you completed. Example, I'm going to do all math, from early/kid to high school. I'd like to see the grade levels checked off.",[1647104850,978000000],412,null,null,null,"7.4.0",null,null,null,null,null,null],["review-5",["A Google user",null],5,null,"This app has helped me quite a bit. I feel like I can stay on track and have a free tutor outside of my college classes and refresh what I forgot in highschool. The English and grammar lessons are easy to remember and well built, and although the math lectures can be slow, they make it easy to understand the material and focus on harder concepts one at a time. You can work on the go without having to have a computer standing by, or at a PC at home. Perfect for my needs!",[1586701583,61000000],232,null,null,null,"6.9.1",null,null,null,null,null,null],["review-6",["A Google user",null],5,null,"It's great, just like the website. 1 thing it is missing is scratch paper or notes. I have galaxy note 8 and was wanting to be able to do work within the app. Would be awesome if you guys added this, you wouldn't even need a stylus one could use their finger, it should at the very least be an option, thank you. EDIT: Just realized they actually added scratch paper, and it works just as well as it does in the full website browser. The app to me is now relatively perfect, 5 stars.",[1605070029,978000000],86,null,null,null,"7.1.0",null,null,null,null,null,null],["review-7",["A Google user",null],3,null,"So, as a 13 year old (about to go to highschool) I have used this frequently in my school, as well as my friends and teachers. Teachers love it because we learn, but the students don't really enjoy it (myself included) but, if you do want people to enjoy it more, make learning fun, like prodigy, or other learning games, maybe have a game show, where you need to multiply fast to beat the computer or your friend. Things like that make the app more intuitive and fun, and easy to do for long periods",[1595021694,297000000],35,null,null,null,"7.0.2",null,null,null,null,null,null],["review-8",["A Google user",null],4,null,"I was homeschooled last year and it was very good as a sidealong with my mathcoursework. I also now use it to keep up with math class. Very clear when explaining, i actually like math now, 9/10, and it would be better if i could have adjusted the text sizes in app. I had to adjust my whole device to see the numbers. Which in turn made me adjust everything else on the device.",[1574213108,801000000],11,null,null,null,"5.2.4",null,null,null,null,null,null],["review-9",["A Google user",null],5,null,"This is a great educational app! I do three of my school subjects on this, and it makes learning easy. They have great informational videos, and quizzes to apply what you've learned. I also think the app layout is great as well. The ability to pin courses is really nice. One thing I wish they would have kept was the jump to the \"up next for you\" lesson/task button that would allow me to get to my course material faster without having to scroll through all of it. Regardless, still a great app!",[1586189472,235000000],410,null,null,null,"6.9.1",null,null,null,null,null,null],["review-10",["A Google user",null],5,null,"I absolutely recommend this app. I had teachers before that couldn't explain things well and I always stayed up studying with Khan Academy. They're very through with subjects and give the best demonstrations on how to do things. it's awesome for both visual and auditory learners. It also has a lot of languages and a very neat and organized setting. You can just download this app, search up what you need and you're good to go! I have definitely aced a few test thanks to Khan Academy. Bless Y'all.",[1562144271,161000000],45,null,null,null,"6.1.1",null,null,null,null,null,null],["review-11",["A Google user",null],5,null,"Awesome app. I am so thankful that it's all free content. I first downloaded this to refresh on math before my placement test for going back to college (I hadn't done a math problem in almost 6 years, so I started from Kindergarten and worked my way up to algebra within a month and a half) and I ended up being placed into college level algebra. I felt so relieved and at ease during the test. I now use it for fun, brushing up on many more subjects. Love the app, thank you so much!",[1573492752,229000000],515,null,null,null,"6.5.1",null,null,null,null,null,null],["review-12",["A Google user",null],3,null,"It's really easy to use, the lessons are short and easy to understand, the teacher is good at explaining the concepts. The main problems is that once you've watched a lesson 90% of the time it doesn't check that you finished it, and there's no way to manually check that you finished it, so it can be easy to loose track. The other problem is that the app struggles to even work, it wont work out of wifi, and it sometimes won't run the tests even on wifi. Otherwise it would be 5 stars",[1663122330,32000000],131,null,null,null,"7.5.2",null,null,null,null,null,null],["review-13",["A Google user",null],4,null,"As I said in another review this concept is perfect for a lot of people who either want to learn new stuff just because or who seemed to get lost in the system in their formative years, like myself. I've watched this application evolve over the course of several years and I can't say I'm all that disappointed in the direction it's going. I would definitely like to see more practical exercises in the physics modules. Forces and Work can be tricky to get a hold of and some practice would be great. That's about all I have negative to say about the app as of late. Keep up the good work.",[1539899122,57000000],158,null,null,null,"5.2.0",null,null,null,null,null,null],["review-14",["A Google user",null],4,null,"Khan Academy is one of the best free education resources there is. I use the website with no problem but the app has a couple. It lets me download sections but when i try to open them offline they do not load and it displays an error message. Also, quizzes/tests do not offer the detailed explanations for each answer choice like they do online, and they are incredibly helpful. It's just as easy to go to the website which works great but it would be nice to have available for offline use.",[1566762294,961000000],20,null,null,null,null,null,null,null,null,null,null],["review-15",["A Google user",null],2,null,"This app was great before the newest update. There were some bugs, like sometimes the equation wouldn't show up. but this was fixed by simply closing the app and reopening it. now, I can barely get through one assignment without taking like 10 minutes! The app is now extremely slow. And I know it's not on my end because I have the Sasmung Galaxy S8, a reasonably powerful phone, and I've barely used half of its storage. Hope this gets fixed.",[1554415924,358000000],39,null,null,null,"6.0.0",null,null,null,null,null,null],["review-16",["A Google user",null],5,null,"Very convenient for math (or any subject) on concepts you have trouble with, but I do wish that I could work out problems without having the need to physically write things down (I just solve problems in my head). If you could add a notes tab on quizzes (where you can tap/slide from the side of your screen to bring it over if you want to use it to type notes down, and to tap/slide it back to to the side of the screen to consume less screen space), this app would be even better :D",[1576638168,595000000],148,null,null,null,"6.5.1",null,null,null,null,null,null],["review-17",["A Google user",null],5,null,"I was so excited to find this app. I've always wanted to learn about a lot of different subjects and now I can/am! Some of the ancient history time line is a little off, it's based around the Christianity/religious timeline. (Which I thought was super lame.) I was super impressed with how much education app has to offer. It's not all just boring, having to read 50 pages in order to finish one section of a section. You go by your own pace of course. Highly recommend.",[1667764214,580000000],237,null,null,null,"7.6.1",null,null,null,null,null,null],["review-18",["A Google user",null],3,null,"Due to the prevalent pandemic, I am now relying on this app for most of my classes. The app is good, but my biggest problem is how the assignments are displayed. They are all shown in a list. I have at least one hundred assignments and it is very time consuming trying to find the specific assignment that I want. It would be nice if the assignments were grouped under the specific course they originated from.",[1585871089,549000000],166,null,null,null,"6.9.1",null,null,null,null,null,null],["review-19",["A Google user",null],5,null,"I was able to relearn everything that the schools failed to teach me, Khan academy helped me learn and understand subjects that I was struggling with in school. Honestly, I could homeschool myself with the app, its far better, cheaper, exciting, interesting, easier, and more useful than school. With my free time, I teach myself advance math with khan academy. Its great.",[154
