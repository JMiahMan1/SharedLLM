 creator in a massive global community<br>- Dive into immersive 3D multiplayer games and safe, inclusive environments designed for users of all ages<br>- Enjoy endless new content added daily and share your creations with millions of players<br><br>ELEVATE YOUR EXPERIENCE WITH ROBLOX PLUS<br>- Get up to 20% discounts on in-game items, enjoy fee-free Robux transfers, and receive a distinct profile badge<br>- Host free, unlimited private servers for your friends <br>- Publish, trade, and resell your own custom avatar creations on the Marketplace<br><br>INDUSTRY-LEADING SAFETY, PRIVACY, AND CIVILITY<br>- Advanced content filtering and age-appropriate moderation<br>- Access age-verified spaces and manage your privacy with Roblox Kids and Select Accounts<br>- Clear community guidelines promoting respectful interactions<br>- Dedicated trust &amp; safety teams working around the clock<br><br>CREATE YOUR OWN GAMES: https://www.roblox.com/develop<br>SUPPORT: https://en.help.roblox.com/hc/en-us<br>CONTACT: https://corp.roblox.com/contact/<br>PRIVACY POLICY: https://www.roblox.com/info/privacy<br>PARENT’S GUIDE: https://corp.roblox.com/parents/<br>TERMS OF USE: https://en.help.roblox.com/hc/en-us/articles/115004647846<br><br>PLEASE NOTE: A network connection is required. Roblox works best over Wi-Fi.<br><br>※ Information on App Permissions: Roblox requires the following permissions for your seamless use of the Roblox app.<br>[Optional Permissions]<br>Notification: For sending notifications (related to the services, experiences, etc.)<br>Microphone: For in-game voice chat features<br>Camera: For animating your avatar with your movement<br>Contacts: For contact importer features (find other users you may know and make recommendations for friends)<br>* You can use the app regardless of whether or not you consent to optional permissions<br>* Certain app features may not work properly if you refuse optional permissions"]],[[null,"Explore a growing library of games of every genre. P <script nonce="x">AF_initDataCallback({key: 'ds:10', hash: '13', data:[[["review-0",["A Google user",null],4,null,"I really like Roblox I play it when I'm board. I love the different varieties of games without having to download. Only issues are it using up the battery and heating up my phone and sometimes the view of your character will glitch and you can only zoom in and out but I figured out to fix it you just need to open the menu. I also recommend adding a \"play later\" playlist for games that you want to play but you don't have time or maybe just playlists in general.",[1735973351,617000000],14591,null,null,null,"2.654.474",null,null,null,null,null,null],["review-1",["A Google user",null],3,null,"This is a game platform, not a game, which is not a bad thing, but it means I'm going to rate this app based on the platform and its games. For games, there is a sea of bad games made for prophet, but among them, there are some amazing games, like Forsaken or Stud Lands, but I'm rating Roblox, so they don't tip the scale that much. The platform has made poor changes, like mostly removing the chat for a safety update that didn't work well. Just find the hidden gems, and you'll have a great time.",[1783583400,614000000],358,null,null,null,"2.727.1199",null,null,null,null,null,null],["review-2",["A Google user",null],4,null,"I personally love this game! It is great for TEENS. If you're worried about your child finding inappropriate stuff, there are settings. The games range from roleplay, to RPG, to sandbox, and mascot horror. You are able to change your character in the catalog, some costing money. in Roblox, you are able to become friends with people from people all around. Make sure to be careful who you add. This game is good to play with friends, and has some very fun variety! It's a good go-to when bored.",[1790889170,795000000],1712,null,null,null,"2.741.1061",null,null,null,null,null,null],["review-3",["A Google user",null],5,null,"BEST GAME EVER OMG, it has SO MANY different games, I can guarantee that YOU will find a game you like, even for adults too, bit there is one slight problem... whenever I join a game like \"sakumi's crafting game modded\" (sorry if thats copyright) it just takes me straight back to home screen, i tried asking ai but it couldn't fully identify the predicament, please respond but overall a really solid game.",[1789579059,865000000],25073,null,null,null,"2.738.1397",null,null,null,null,null,null],["review-4",["A Google user",null],3,null,"Edit : Dropped to 3 stars because of some bugs. Some games i play will randomly get lag spikes and jumped up the pings to 300+, while other games like 99 nights does not making any lag spikes, but instead all textures will get blurry only for a moment. I have no ideas what's going on with that issues, but fix it as soon as possible so i can play some games in peace, instead of focusing on adding features that no one asked for. Besides of that, it's still playable, so best to get used to it.",[1764208624,86000000],15468,null,null,null,"2.700.937",null,null,null,null,null,null],["review-5",["A Google user",null],4,null,"I’ve been playing for a long time and the variety of games is unmatched. However, for mobile users, the login and sign-up process can be very buggy. Switching between accounts often causes the app to freeze or throw an error code. ​Also, for bigger games, the optimization could be better to prevent crashing during high-action moments. If they fixed the account switching and added a \"Lite Mode\" for lower-end devices, this would easily be a 5-star app!",[1777390838,954000000],4756,null,null,null,"2.718.1110",null,null,null,null,null,null],["review-6",["A Google user",null],3,null,"It's good and the game variety is amazing, but there's SO many problems. Everytime I open it, the \"no connection\" message will pop up with connection, but loads me in once I retry. However that's not my biggest problem. Alot of times when I join a game, ESPECIALLY if I have headphones in or music playing, it'll tell me I have no sound driver when I DO, or it'll change my music output to my phone speaker instead of headphones. Not to mention the horrible \"safety\" measures and accessory prices.",[1764066019,110000000],8856,null,null,null,"2.698.941",null,null,null,null,null,null],["review-7",["A Google user",null],3,null,"This game is nice, which we can change avatar, playing any games playing and make friends. But I really wanted to say there's a bug in this game or is my device is old. First, Whenever I play games, is like laggy and my WiFi is bad. When I check is all good. Second, again when I play game. Is auto leave, like example I don't want to leave but it leaves too. Last, i tried to join my friend, and then I didn't even walk or chatting something and is auto leaving. I hope you fix this.",[1734943610,932000000],4033,null,null,null,"2.654.474",null,null,null,null,null,null],["review-8",["A Google user",null],3,null,"I really love Roblox, I have been playing it throughout almost my whole childhood. But there is still some issues. Like for example no matter how many times I update or delete the app and reinstall it. It still bugs out has has glitches. I love Roblox but the bugs I have are so bad sometimes it freezes my computer or phone. One time it froze my computer to the point where I could not even turn it off or on. And I had to charge it and hard reset it for it to even work again.",[1741138428,963000000],9651,null,null,null,"2.662.537",null,null,null,null,null,null],["review-9",["A Google user",null],3,null,"The game is good overall, it has many fun opportunities and it's pretty welcoming for everyone. However, these new updates are getting out of hand. Removing the class heads, faces, CLOTHING, R6 etc?? This is all ridiculous. I personally prefer classic clothing because they're cheaper and just look better!! If you keep doing this you'll lose more customers and players. Just keep all of it and you'll survive. I miss the old Roblox.",[1747687789,535000000],2784,null,null,null,null,null,null,null,null,null,null],["review-10",["A Google user",null],5,null,"Hey! The game is great, but I'd like to highly recommend adding a **Robux refund** feature. I don't mean refunding real money—just refunding the Robux spent on game passes. This would let players refund game passes they bought for games they rarely play anymore, so they can get their Robux back and use them in other games. I think it would be a really helpful feature for players who regret purchases or no longer use certain game passes.",[1789259020,874000000],2161,null,null,null,"2.738.1397",null,null,null,null,null,null],["review-11",["A Google user",null],5,null,"Roblox is honestly one of the best games out there! It has so many different games, worlds, and adventures to explore—you’ll literally never get bored. Whether you love roleplay, adventures, building, or fun mini-games, there’s always something perfect for you. You can customize your avatar however you want, hang out with friends, and meet new people too. It works great on phones, tablets, and computers, so you can play anytime, anywhere.",[1786867885,899000000],1288,null,null,null,"2.734.916",null,null,null,null,null,null],["review-12",["A Google user",null],3,null,"It's a great game but it would be better if there was a way to earn Robux in any way legally because I've seen a lot of people going on cracked websites to buy Robux. Oh yeah and one more little thing there are some words in the game that are not offensive in any way but still get moderated for example numbers and some times even names of people",[1789026013,732000000],108,null,null,null,"2.737.1584",null,null,null,null,null,null],["review-13",["A Google user",null],4,null,"Thus game is wonderful. The game randomly shuts down and its super laggy for laptop and maybe pc and mobile. Over all this game is the best 4 years of and it's awesome - 3 years later and it's still one of my most favoritable games of all time, yes the new chat features and settings have made it not the best anymore but it doesn't randomly crash on me anymore and it still is awesome",[1788556254,866000000],103,null,null,null,"2.737.1584",null,null,null,null,null,null],["review-14",["A Google user",null],3,null,"This game cannot be determined by a singular conclusion whether being \"bad\" or \"good\", due to its function to have multiple games much like an engine. I will be rating it by the functionality of the main menu, firstly the UI right now is clean and simple which is likeable, however people can dislike the Roblox kids UI because the ideal thought of Roblox kids is a engine which is visualized as cartoon ish and have a highly bright/neon color, it is poorly because the Roblox kids log- (pls words)",[1788712541,658000000],86,null,null,null,"2.736.1408",null,null,null,null,null,null],["review-15",["A Google user",null],1,null,"I had 30 dollars on a gift card, I got the credits and used the credits to get a 22 dollar premium package that was supposed to come with 2000 robux, it's been 1 months and I still don't have my robux? that's 2 months I was supposed to get something at the beginning, I'm supposed to be getting 2000 monthly, but I haven't gotten anything for either of them, this month and last the update before this was August 5th, now I'm updating again and still nothing",[1788660365,185000000],552,null,null,null,"2.737.1584",null,null,null,null,null,null],["review-16",["A Google user",null],2,null,"dude seriously? Whoever made the security thingy when you want to enter the game is stupid ngl I tried it so many times and it keeps saying that I failed even when I got everything correct, some of it doesn't even have the same color, it shows that it wants white and black but I went through all of it but there's none, except black and black of the same symbols that they want I click it and it's still wrong, please fix it!!!!",[1787887253,624000000],102,null,null,null,"2.732.1043",null,null,null,null,null,null],["review-17",["A Google user",null],3,null,"I am unsure what to say about this app but I will try to sum it up in 3 pros and 3 cons! Pro: 1: lots of fun games 2: tons of fun avatar customization options 3: good graphics cons: 1: expensive pricing on robux and items 2: Toxic, dangerous and predatory people are a large risk (at least a 65% risk) 3: tons of bots, hackers, brainrot and scams from other players.",[1788157663,396000000],117,null,null,null,"2.735.1138",null,null,null,null,null,null],["review-18",["A Google user",null],3,null,"Awesome game! So much different games on one platform! however I have been playing for a long while and added i have collected badges over the years, I have over 3000 from multiple games and because I play on mobile it adds excess load and makes me lag extremely hard more than what I really should -that's why new accounts don't seem to lag as often- so I would like the ability to select the badges you want to delete and want to keep because right now one by one is tiresome.",[1787389550,313000000],70,null,null,null,"2.734.916",null,null,null,null,null,null],["review-19",["A Google user",null],4,null,"Fun game, but you have to watch out for yourself and others because there are some bad people on this app. As long as you're careful and keep a positive attitude, nothing should go wrong. The moderation still sucks, but most people I report because they bullied me have chat disabled for a few days. Keep yourself and your friends safe and have fun!",[1789513725,758000000],85,null,null,null,"2.738.1397",null,null,null,null,null,null]],[null,"CrABIqcBARqIumiOtxqkCgpKrM2JQZx8a2m6b0qTla_BMoJ0O7cBXugVmYp0QefHXNCtsXgON-fEQrhFXI6ht_4xGyCEXJ52vTbMP9fQgvQf81wSI9GIK1lEyglXxTJkSE5rZKg2bOIRFPxLlh8aWydcRogRbwDxKCuGdpKAUXOkag3FR37EM2cKrQuLSB4ghxbWnWotLuFXysNRngdCYmuEClc0T_zqQLaAYdAol6no1wY"],[[null,[[1800],null,[72000]]]]], sideChannel: {}});</script>
