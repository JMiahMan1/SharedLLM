# Execution runs on the host network, so it does not get Docker's resolver.
# SharedLLM's DNS service (sharedllm_dns on the bridge) answers first: it
# knows the .local hosts (e.g. jeremiah-home-desktop.local, the audio and
# Ollama box), which plain LAN DNS does not, and it caches. The router is the
# fallback if the DNS container is down.
nameserver 172.26.0.254
nameserver 192.168.2.1
options timeout:2 attempts:2
