# Execution runs on the host network, so it does not get Docker's resolver.
# SharedLLM's DNS service (sharedllm_dns on the bridge) answers first: it
# knows the .local hosts (e.g. llm-host.local, the audio and Ollama box),
# which plain LAN DNS does not, and it caches. To fall back to the LAN router
# when the DNS container is down, copy this file to data/execution-resolv.conf,
# add "nameserver <router ip>" after the first line, and set
# EXECUTION_RESOLV_CONF=./data/execution-resolv.conf in .env.
nameserver 172.26.0.254
options timeout:2 attempts:2
