<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA Web Player Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 1rem; min-height: 100vh; }
        h1 { font-size: 1.2rem; margin-bottom: 0.75rem; color: #38bdf8; }
        h2 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 0.5rem; }
        .card { background: #1e293b; border-radius: 8px; padding: 1rem; margin-bottom: 0.5rem; border: 1px solid #334155; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; }
        input[type="text"] { width: 100%; padding: 0.4rem; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #e2e8f0; font-size: 0.8rem; }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        button { padding: 0.4rem 0.75rem; border-radius: 4px; border: none; cursor: pointer; font-size: 0.75rem; font-weight: 500; }
        button.primary { background: #0284c7; color: white; }
        button.primary:hover { background: #0369a1; }
        button.success { background: #16a34a; color: white; }
        button.danger { background: #dc2626; color: white; }
        button.secondary { background: #334155; color: #e2e8f0; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .controls { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0.5rem 0; }
        .status { padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.75rem; margin: 0.4rem 0; }
        .status.info { background: #0c4a6e; border: 1px solid #0284c7; color: #7dd3fc; }
        .status.success { background: #052e16; border: 1px solid #16a34a; color: #4ade80; }
        .status.error { background: #450a0a; border: 1px solid #dc2626; color: #f87171; }
        .status.warn { background: #422006; border: 1px solid #d97706; color: #fbbf24; }
        .status.active { background: #172554; border: 1px solid #3b82f6; color: #93c5fd; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        #log { max-height: 300px; overflow-y: auto; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.65rem; line-height: 1.4; padding: 0.5rem; background: #020617; border-radius: 4px; }
        #log .log-entry { padding: 1px 0; border-bottom: 1px solid #1e293b; word-break: break-all; }
        #log .log-time { color: #475569; }
        #log .log-info { color: #38bdf8; }
        #log .log-error { color: #f87171; }
        #log .log-success { color: #4ade80; }
        #log .log-warn { color: #fbbf24; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
        #player-info { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; font-size: 0.75rem; }
        #player-info .info-item { background: #0f172a; padding: 0.35rem 0.5rem; border-radius: 4px; }
        #player-info .info-label { color: #64748b; font-size: 0.65rem; }
        #player-info .info-value { color: #e2e8f0; }
        audio { width: 100%; max-width: 400px; margin-top: 0.5rem; }
        #search-results { max-height: 300px; overflow-y: auto; }
        .search-item { padding: 0.5rem; border-bottom: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .search-item:hover { background: #334155; }
        .search-item-name { color: #e2e8f0; font-size: 0.8rem; }
        .search-item-meta { color: #64748b; font-size: 0.7rem; }
        .search-item-btn { background: #0284c7; color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 3px; font-size: 0.7rem; cursor: pointer; }
        select { padding: 0.4rem; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #e2e8f0; font-size: 0.8rem; }
        .tag { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.65rem; margin-left: 0.25rem; }
        .tag-sendspin { background: #16a34a; color: white; }
        .tag-jsonrpc { background: #7c3aed; color: white; }
        .tag-ws { background: #d97706; color: white; }
    </style>
</head>
<body>
    <h1>MA Web Player Test</h1>

    <!-- Auth -->
    <div class="card">
        <div id="auth-status">
            <div class="status info">Not logged in — login to UI first then refresh this page</div>
        </div>
        <input type="text" id="api-token" placeholder="Auto-detected from localStorage" style="display: none;">
    </div>

    <!-- Connection & Player State -->
    <div class="grid-2">
        <div class="card">
            <h2>Connection State</h2>
            <div id="connection-status"><div class="status info">Disconnected</div></div>
            <div class="controls">
                <button class="primary" id="btn-connect">Init Player</button>
                <button class="danger" id="btn-disconnect" disabled>Shutdown</button>
                <button class="secondary" id="btn-reconnect" disabled>Reconnect</button>
            </div>
            <div class="controls">
                <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; margin: 0;">
                    Volume: <input type="range" id="volume-slider" min="0" max="100" value="70" style="width: 120px;">
                    <span id="volume-value">70</span>
                </label>
            </div>
            <div class="controls">
                <button class="secondary" id="btn-play" disabled>Play</button>
                <button class="secondary" id="btn-pause" disabled>Pause</button>
            </div>
        </div>
        <div class="card">
            <h2>Player State</h2>
            <div id="player-info">
                <div class="info-item"><div class="info-label">Player ID</div><div class="info-value" id="info-playerId">-</div></div>
                <div class="info-item"><div class="info-label">Title</div><div class="info-value" id="info-title">-</div></div>
                <div class="info-item"><div class="info-label">Artist</div><div class="info-value" id="info-artist">-</div></div>
                <div class="info-item"><div class="info-label">Duration</div><div class="info-value" id="info-duration">0s</div></div>
                <div class="info-item"><div class="info-label">Position</div><div class="info-value" id="info-position">0s</div></div>
                <div class="info-item"><div class="info-label">Progress</div><div class="info-value" id="info-progress">0%</div></div>
                <div class="info-item"><div class="info-label">Volume</div><div class="info-value" id="info-volume">-</div></div>
                <div class="info-item"><div class="info-label">Muted</div><div class="info-value" id="info-muted">-</div></div>
                <div class="info-item"><div class="info-label">State</div><div class="info-value" id="info-state">-</div></div>
                <div class="info-item"><div class="info-label">Playing</div><div class="info-value" id="info-playing">-</div></div>
            </div>
        </div>
    </div>

    <!-- Media Search -->
    <div class="card">
        <h2>Search & Play</h2>
        <div class="controls">
            <input type="text" id="search-input" placeholder="Search Music Assistant..." style="flex: 1;">
            <select id="search-domain">
                <option value="music_assistant">Music Assistant</option>
                <option value="audiobookshelf">Audiobookshelf</option>
            </select>
            <button class="primary" id="btn-search">Search</button>
        </div>
        <div id="search-results"></div>
    </div>

    <!-- Media URI direct -->
    <div class="card">
        <h2>Direct Media URI</h2>
        <div class="controls">
            <input type="text" id="uri-input" placeholder="spotify://track/xxx or audiobookshelf://book/xxx" style="flex: 1;">
            <button class="primary" id="btn-play-uri">Play URI</button>
        </div>
    </div>

    <!-- Debug Log -->
    <div class="card">
        <h2>Debug Log</h2>
        <div class="controls">
            <button class="secondary" id="btn-clear-log">Clear Log</button>
            <button class="secondary" id="btn-toggle-sendspin" style="background: #16a34a;">Sendspin: ON</button>
            <button class="secondary" id="btn-toggle-jsonrpc" style="background: #7c3aed;">JSON-RPC: ON</button>
        </div>
        <div id="log"></div>
    </div>

    <!-- Debug -->
    <div class="card">
        <h2>Debug</h2>
        <div class="controls">
            <button class="secondary" id="btn-list-players">List Players</button>
            <button class="secondary" id="btn-list-queues">List Queues</button>
            <button class="secondary" id="btn-test-player-query">Test Player Query</button>
            <button class="secondary" id="btn-register-player">Register Player</button>
        </div>
        <div id="debug-output" style="max-height: 200px; overflow-y: auto; font-size: 0.7rem; color: #94a3b8; margin-top: 0.5rem; padding: 0.5rem; background: #020617; border-radius: 4px;"></div>
    </div>

    <!-- Audio -->
    <div class="card">
        <h2>Audio Output</h2>
        <audio id="audio-player" controls></audio>
    </div>

    <script type="module" src="/assets/ma-stream-test.js"></script>
</body>
</html>
