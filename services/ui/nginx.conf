server {
    listen 8008;
    server_name localhost;

    # pdf.js worker and other ES modules must be served as JS, not
    # application/octet-stream, or dynamic import() fails in the browser.
    # IMPORTANT: the types directive REPLACES the inherited map, so the
    # full mime.types must be included here first or every asset (including
    # the main .js bundle) degrades to application/octet-stream.
    types {
        include /etc/nginx/mime.types;
        text/javascript mjs;
    }

    location /ma-stream-test.html {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests through Caddy to Gateway
    location /api {
        proxy_pass http://caddy:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        proxy_pass http://caddy:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
