<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('jarvis_dark_mode') || localStorage.getItem('jarvis_theme') || 'dark';
          let dark = saved === 'dark';
          if (saved === 'system') {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (dark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          
          // Apply to body as soon as it mounts to prevent background gradient FOUC
          if (document.body) {
            document.body.classList.add(dark ? 'night-mode' : 'day-mode');
          } else {
            const observer = new MutationObserver(function(mutations, obs) {
              if (document.body) {
                document.body.classList.add(dark ? 'night-mode' : 'day-mode');
                obs.disconnect();
              }
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
          }
        } catch (e) {
          console.error('FOUC prevention script failed:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Jarvis OS - The Family AI Home Operating System. Centralized control for identity, storage, automation, and communication." />
    <title>Jarvis OS | Family AI Home</title>
    <style>
      body { margin: 0; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at top left, #1e1b4b, #0f172a); z-index: 9999; transition: opacity 0.3s; }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash .title { color: #6366f1; font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; animation: pulse 2s ease-in-out infinite; }
      #splash .bar { width: 12rem; height: 4px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; }
      #splash .bar::after { content: ''; display: block; width: 30%; height: 100%; background: #6366f1; border-radius: 999px; animation: slide 1.5s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @keyframes slide { 0% { transform: translateX(-100%); } 50% { transform: translateX(250%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="splash"><div class="title">Initializing Jarvis OS...</div><div class="bar"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
