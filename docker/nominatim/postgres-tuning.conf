# Nominatim's PostgreSQL, sized for a shared server (the image's defaults --
# 2 GB shared buffers, 10 GB maintenance memory -- assume a dedicated host).
# Mounted over /etc/postgresql/16/main/conf.d/postgres-tuning.conf.
shared_buffers = 512MB
maintenance_work_mem = 1GB
autovacuum_work_mem = 256MB
work_mem = 32MB
effective_cache_size = 2GB
synchronous_commit = off
max_wal_size = 1GB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
