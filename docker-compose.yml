networks:
  sharedllm:
    external: true
    name: sharedllm_default

services:
  dns-sync:
    image: ghcr.io/jmiahman1/sharedllm-dns_sync:latest
    build:
      context: .
      dockerfile: services/dns_sync/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_dns_sync
    restart: unless-stopped
    network_mode: host
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DNS_POLL_INTERVAL=30
      - DNS_LISTEN_PORT=5353
      - UPSTREAM_DNS=127.0.0.11

  dns-forwarder:
    image: ghcr.io/jmiahman1/sharedllm-dns-forwarder:latest
    build:
      context: .
      dockerfile: services/dns-forwarder/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_dns-forwarder
    restart: unless-stopped
    ports:
      - "53:53/udp"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DNS_SYNC_HOST=172.17.0.1
      - DNS_SYNC_PORT=5353
    depends_on:
      - dns-sync
    networks:
      - sharedllm

  caddy:
    image: caddy:2-alpine
    container_name: sharedllm_caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - gateway
      - identity
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  identity:
    image: ghcr.io/jmiahman1/sharedllm-identity:latest
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_identity
    restart: unless-stopped
    ports:
      - 8001:8001
    env_file:
      - .env
    environment:
      - IDENTITY_DATABASE_URL=sqlite:////data/identity.db
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - LEGACY_ENV_PATH=/app/.env
      - FORCE_RESEED=${FORCE_RESEED:-false}
      - IDENTITY_SVC_URL=${IDENTITY_SVC_URL}
      - TZ=America/Phoenix
    volumes:
      - identity_db:/data
      - /etc/localtime:/etc/localtime:ro
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
    dns:
      - 172.26.0.1
    networks:
      - sharedllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  execution:
    image: ghcr.io/jmiahman1/sharedllm-execution:latest
    build:
      context: .
      dockerfile: services/execution/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_execution
    restart: always
    network_mode: host
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      # Host-networked: use Caddy to proxy DNS sync REST API
      - DNS_SYNC_API_URL=http://localhost:8080/api/dns-sync
      - IDENTITY_SVC_URL=http://localhost:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://localhost:8004
      - STORAGE_SVC_URL=http://localhost:8005
      - LOGGING_SVC_URL=http://localhost:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://localhost:8007
      - REDIS_URL=redis://localhost:6379/0
      - SEARXNG_URL=http://localhost:8080
      - EXECUTION_EXTERNAL_HOST=192.168.2.205
      - TEMP_MEDIA_DIR=/workspaces
      - MODELS_DIR=/workspaces/models
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
      - WORKSPACE_ROOT=/workspaces
    security_opt:
      - label=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jeremiah/.ssh:/home/sharedllm/.ssh:ro
      - kokoro_models:/app/models
      - ${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}:/workspaces
      - execution_data:/data

  rag:
    image: ghcr.io/jmiahman1/sharedllm-rag:latest
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_rag
    restart: unless-stopped
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - TZ=America/Phoenix
      - HUGGINGFACE_HUB_DISABLE_XET=1
      - EMBEDDING_MODEL=nomic-ai/nomic-embed-text-v1.5
    ports:
      - "8004:8004"
    volumes:
      - chroma_data:/data
      - huggingface_cache:/root/.cache/huggingface
      - qdrant_cache:/root/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  capabilities-sync:
    image: ghcr.io/jmiahman1/sharedllm-rag:latest
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_capabilities_sync
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      - RAG_SVC_URL=http://rag:8004
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
    depends_on:
      rag:
        condition: service_healthy
    command: python3 scripts/index_capabilities.py
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  gateway:
    image: ghcr.io/jmiahman1/sharedllm-gateway:latest
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_gateway
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      identity:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - CONTROL_PLANE_URL=http://control_plane:8008
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    ports:
      - "11435:11435"
    volumes:
      - ./data/phrasebook.json:/app/data/phrasebook.json:ro
      - huggingface_cache:/home/sharedllm/.cache/huggingface
      - qdrant_cache:/home/sharedllm/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  logging:
    image: ghcr.io/jmiahman1/sharedllm-logging:latest
    build:
      context: .
      dockerfile: services/logging/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_logging
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  automation:
    image: ghcr.io/jmiahman1/sharedllm-automation:latest
    build:
      context: .
      dockerfile: services/automation/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_automation
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - execution
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  storage:
    image: ghcr.io/jmiahman1/sharedllm-storage:latest
    build:
      context: .
      dockerfile: services/storage/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_storage
    restart: unless-stopped
    ports:
      - 8005:8005
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - NEXTCLOUD_URL=${NEXTCLOUD_URL:-}
      - NEXTCLOUD_USER=${NEXTCLOUD_USER:-}
      - NEXTCLOUD_PASS=${NEXTCLOUD_PASS:-}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  workspace_runtime:
    image: ghcr.io/jmiahman1/sharedllm-workspace_runtime:latest
    build:
      context: .
      dockerfile: services/workspace_runtime/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_workspace_runtime
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    ports:
      - 8007:8007
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - WORKSPACE_DATABASE_URL=sqlite:////data/workspace_runtime.db
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/workspaces
      - GIT_WEBHOOK_SECRET=${GIT_WEBHOOK_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    volumes:
      - ${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}:/workspaces
      - /home/jeremiah/SharedLLM:/host-repo
      - workspace_runtime_data:/data
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  ui:
    image: ghcr.io/jmiahman1/sharedllm-ui:latest
    build: ./services/ui
    container_name: sharedllm_ui
    restart: unless-stopped
    environment:
      - TZ=America/Phoenix
    depends_on:
      - gateway
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  redis:
    image: redis:7-alpine
    container_name: sharedllm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

  control_plane:
    image: ghcr.io/jmiahman1/sharedllm-control_plane:latest
    build:
      context: .
      dockerfile: services/control_plane/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_control_plane
    restart: always
    ports:
      - 8008:8008
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    privileged: true
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server.local:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution.local:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TZ=America/Phoenix
      - GHCR_TOKEN=${GHCR_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 172.26.0.1
    networks:
      - sharedllm

volumes:
  identity_db:
  chroma_data:
  logging_data:
  workspace_runtime_data:
  redis_data:
  huggingface_cache:
  qdrant_cache:
  caddy_data:
  caddy_config:
  kokoro_models:
  execution_data:
