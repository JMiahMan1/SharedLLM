services:
  identity:
    build: ./services/identity
    container_name: sharedllm_identity
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - IDENTITY_DATABASE_URL=sqlite:////data/identity.db
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - FERNET_KEY=${FERNET_KEY}
      - TZ=America/Phoenix
    volumes:
      - identity_db:/data
      - ./.env:/app/.env.legacy:ro
      - /etc/localtime:/etc/localtime:ro

  execution:
    build: ./services/execution
    container_name: sharedllm_execution
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - REDIS_URL=redis://127.0.0.1:6379/0
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro

  rag:
    build: ./services/rag
    container_name: sharedllm_rag
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - TZ=America/Phoenix
    volumes:
      - chroma_data:/data
      - huggingface_cache:/root/.cache/huggingface
      - /etc/localtime:/etc/localtime:ro

  gateway:
    build: ./services/gateway
    container_name: sharedllm_gateway
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - IDENTITY_SVC_URL=http://127.0.0.1:8001
      - EXECUTION_SVC_URL=http://127.0.0.1:8003
      - RAG_SVC_URL=http://127.0.0.1:8004
      - STORAGE_SVC_URL=http://127.0.0.1:8005
      - LOGGING_SVC_URL=http://127.0.0.1:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://127.0.0.1:8007
      - REDIS_URL=redis://127.0.0.1:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - FAST_PATH_THRESHOLD=${FAST_PATH_THRESHOLD:-0.85}
      - CODING_MODEL=${CODING_MODEL:-qwen2.5-coder:7b}
      - TZ=America/Phoenix
    volumes:
      - ./data/phrasebook.json:/app/data/phrasebook.json:ro
      - /etc/localtime:/etc/localtime:ro

  logging:
    build: ./services/logging
    container_name: sharedllm_logging
    restart: unless-stopped
    network_mode: "host"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
    volumes:
      - logging_data:/app/data
      - /etc/localtime:/etc/localtime:ro

  storage:
    build: ./services/storage
    container_name: sharedllm_storage
    restart: unless-stopped
    network_mode: "host"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
    volumes:
      - ./:/workspace/SharedLLM:ro
      - /etc/localtime:/etc/localtime:ro

  workspace_runtime:
    build: ./services/workspace_runtime
    container_name: sharedllm_workspace_runtime
    restart: unless-stopped
    network_mode: "host"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - IDENTITY_SVC_URL=http://127.0.0.1:8001
      - STORAGE_SVC_URL=http://127.0.0.1:8005
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/workspace
      - TZ=America/Phoenix
    volumes:
      - ./:/workspace/SharedLLM
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - /etc/localtime:/etc/localtime:ro

  redis:
    image: redis:7-alpine
    container_name: sharedllm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    network_mode: "host"
    volumes:
      - redis_data:/data

  automation:
    build: ./services/automation
    container_name: sharedllm_automation
    restart: unless-stopped
    network_mode: "host"
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - EXECUTION_SVC_URL=http://127.0.0.1:8003
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
    depends_on:
      - redis
      - execution

volumes:
  identity_db:
  chroma_data:
  logging_data:
  redis_data:
  huggingface_cache:
