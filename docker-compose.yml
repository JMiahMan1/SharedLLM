networks:
  sharedllm:
    name: sharedllm_default
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

services:
  dns:
    image: ghcr.io/jmiahman1/sharedllm-dns:latest
    build:
      context: .
      dockerfile: services/dns/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_dns
    restart: unless-stopped
    networks:
      sharedllm:
        ipv4_address: 172.26.0.254
    ports:
      - "15353:53/udp"
      - "15353:53/tcp"
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      - DNS_PORT=53
      - UPSTREAM_DNS=192.168.1.1
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}

  caddy:
    image: ghcr.io/jmiahman1/sharedllm-caddy:latest
    container_name: sharedllm_caddy
    restart: unless-stopped
    networks:
      - sharedllm
    ports:
      - "8080:80"
      - "8443:443"
      - "8001:8001"  # Host:8001 -> Caddy -> identity:8001
      - "8095:8095"  # Host:8095 -> Caddy -> ma:8095
      - "11435:11435" # Host:11435 -> Caddy -> gateway:11435
      - "8004:8004"  # Host:8004 -> Caddy -> rag:8004
      - "8005:8005"  # Host:8005 -> Caddy -> storage:8005
      - "8006:8006"  # Host:8006 -> Caddy -> logging:8006
      - "8007:8007"  # Host:8007 -> Caddy -> workspace_runtime:8007
      - "8008:8008"  # Host:8008 -> Caddy -> control_plane:8008
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - gateway
      - identity
    dns:
      - 172.26.0.254

  identity:
    image: ghcr.io/jmiahman1/sharedllm-identity:latest
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_identity
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - IDENTITY_DATABASE_URL=sqlite:////data/identity.db
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - LEGACY_ENV_PATH=/app/.env
      - FORCE_RESEED=${FORCE_RESEED:-false}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - TZ=America/Phoenix
    volumes:
      - identity_db:/data
      - /etc/localtime:/etc/localtime:ro
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
    dns:
      - 172.26.0.254
    networks:
      - sharedllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  execution:
    image: ghcr.io/jmiahman1/sharedllm-execution:latest
    build:
      context: .
      dockerfile: services/execution/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_execution
    restart: always
    network_mode: host
    # Run as the same uid/gid as workspace_runtime so all git/shell operations
    # in /workspaces produce files owned by uid 1000 (not root). The IDE commits
    # via workspace_runtime (uid 1000), so a root-owned .git created by the
    # execution service would otherwise cause "Permission denied" on index.lock.
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=host
      - IDENTITY_SVC_URL=${HOST_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${HOST_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${HOST_RAG_SVC_URL}
      - STORAGE_SVC_URL=${HOST_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${HOST_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${HOST_WORKSPACE_RUNTIME_SVC_URL}
      - REDIS_URL=${HOST_REDIS_URL}
      - SEARXNG_URL=${HOST_SEARXNG_URL}
      - EXECUTION_EXTERNAL_HOST=host.docker.internal
      - TEMP_MEDIA_DIR=/workspaces
      - MODELS_DIR=/workspaces/models
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
      - WORKSPACE_ROOT=/workspaces
      # Host path that /workspaces maps to, so the sandbox can mount the real
      # workspace data (the Docker daemon resolves mount sources on the host).
      - WORKSPACE_HOST_PATH=${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}
    security_opt:
      - label=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jeremiah/.ssh:/home/sharedllm/.ssh:ro
      - kokoro_models:/app/models
      - ${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}:/workspaces
      - execution_data:/data

  rag:
    image: ghcr.io/jmiahman1/sharedllm-rag:latest
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - RAG_DB_PATH=/data/rag.db
      - TZ=America/Phoenix
      - HUGGINGFACE_HUB_DISABLE_XET=1
      - EMBEDDING_MODEL=nomic-ai/nomic-embed-text-v1.5
    volumes:
      - chroma_data:/data
      - huggingface_cache:/root/.cache/huggingface
      - qdrant_cache:/root/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jeremiah-home-desktop.local:${OLLAMA_HOST_IP}"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  capabilities-sync:
    image: ghcr.io/jmiahman1/sharedllm-rag:latest
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_capabilities_sync
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      - NETWORK_MODE=bridge
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
    depends_on:
      rag:
        condition: service_healthy
    command: python3 scripts/index_capabilities.py
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  gateway:
    image: ghcr.io/jmiahman1/sharedllm-gateway:latest
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_gateway
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    depends_on:
      identity:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jeremiah-home-desktop.local:${OLLAMA_HOST_IP}"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - CONTROL_PLANE_URL=http://control_plane:8008
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    volumes:
      - ./data/phrasebook.json:/app/data/phrasebook.json:ro
      - huggingface_cache:/home/sharedllm/.cache/huggingface
      - qdrant_cache:/home/sharedllm/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  logging:
    image: ghcr.io/jmiahman1/sharedllm-logging:latest
    build:
      context: .
      dockerfile: services/logging/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jeremiah-home-desktop.local:${OLLAMA_HOST_IP}"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  automation:
    image: ghcr.io/jmiahman1/sharedllm-automation:latest
    build:
      context: .
      dockerfile: services/automation/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_automation
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - execution
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jeremiah-home-desktop.local:${OLLAMA_HOST_IP}"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  storage:
    image: ghcr.io/jmiahman1/sharedllm-storage:latest
    build:
      context: .
      dockerfile: services/storage/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_storage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL:-}
      - NEXTCLOUD_USER=${NEXTCLOUD_USER:-}
      - NEXTCLOUD_PASS=${NEXTCLOUD_PASS:-}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jeremiah-home-desktop.local:${OLLAMA_HOST_IP}"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  workspace_runtime:
    image: ghcr.io/jmiahman1/sharedllm-workspace_runtime:latest
    build:
      context: .
      dockerfile: services/workspace_runtime/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_workspace_runtime
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - WORKSPACE_DATABASE_URL=sqlite:////data/workspace_runtime.db
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/workspaces
      - GIT_WEBHOOK_SECRET=${GIT_WEBHOOK_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
      # Host path that /workspaces maps to, so the sandbox can mount the real
      # workspace data (the Docker daemon resolves mount sources on the host).
      - WORKSPACE_HOST_PATH=${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}
    volumes:
      - ${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}:/workspaces
      - /home/jeremiah/SharedLLM:/host-repo
      - workspace_runtime_data:/data
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - /etc/localtime:/etc/localtime:ro
      # Allow the runtime to spawn per-workspace sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  ui:
    image: ghcr.io/jmiahman1/sharedllm-ui:latest
    build: ./services/ui
    container_name: sharedllm_ui
    restart: unless-stopped
    environment:
      - TZ=America/Phoenix
    depends_on:
      - gateway
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  redis:
    image: redis:7-alpine
    container_name: sharedllm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  control_plane:
    image: ghcr.io/jmiahman1/sharedllm-control_plane:latest
    build:
      context: .
      dockerfile: services/control_plane/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    hostname: control-plane.local
    container_name: sharedllm_control_plane
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    privileged: true
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - RAG_SVC_URL=${BRIDGE_RAG_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TZ=America/Phoenix
      - GHCR_TOKEN=${GHCR_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jeremiah-home-desktop.local:${OLLAMA_HOST_IP}"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

volumes:
  identity_db:
  chroma_data:
  logging_data:
  workspace_runtime_data:
  redis_data:
  huggingface_cache:
  qdrant_cache:
  caddy_data:
  caddy_config:
  kokoro_models:
  execution_data:
