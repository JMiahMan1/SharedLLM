services:
  caddy:
    image: caddy:2-alpine
    container_name: sharedllm_caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - gateway
      - identity

  identity:
    build: ./services/identity
    container_name: sharedllm_identity
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - IDENTITY_DATABASE_URL=sqlite:////data/identity.db
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - FERNET_KEY=${FERNET_KEY}
      - TZ=America/Phoenix
    volumes:
      - identity_db:/data
      - ./.env:/app/.env.legacy:ro
      - /etc/localtime:/etc/localtime:ro

  execution:
    build: ./services/execution
    container_name: sharedllm_execution
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - REDIS_URL=redis://redis:6379/0
      - RAG_SVC_URL=http://rag:8004
      - TZ=America/Phoenix
    group_add:
      - "${DOCKER_GID:-980}"
    security_opt:
      - label=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./services/tests:/app/tests
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace/SharedLLM

  rag:
    build: ./services/rag
    container_name: sharedllm_rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - TZ=America/Phoenix
    ports:
      - "8004:8004"
    volumes:
      - chroma_data:/data
      - huggingface_cache:/root/.cache/huggingface
      - qdrant_cache:/root/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
      - ./services/rag/main.py:/app/main.py
      - ./services/rag/schemas.py:/app/schemas.py
    # ADDED: Healthcheck so the sync script knows when to run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ADDED: Auto-syncs your tools to RAG on startup, then exits gracefully
  capabilities-sync:
    build: ./services/rag
    container_name: sharedllm_capabilities_sync
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - RAG_SVC_URL=http://rag:8004
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - PYTHONPATH=/app
    depends_on:
      rag:
        condition: service_healthy
    command: python3 scripts/index_capabilities.py

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: sharedllm_gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - OLLAMA_TIMEOUT=600
      - FAST_PATH_THRESHOLD=${FAST_PATH_THRESHOLD:-0.85}
      - CODING_MODEL=${CODING_MODEL:-qwen2.5-coder:7b}
      - TZ=America/Phoenix
    volumes:
      - ./data/phrasebook.json:/app/data/phrasebook.json:ro
      - ./services/gateway/main.py:/app/main.py
      - ./services/gateway/history.py:/app/history.py
      - ./services/gateway/prompts.py:/app/prompts.py
      - ./services/gateway/intent_engine.py:/app/intent_engine.py
      - huggingface_cache:/root/.cache/huggingface
      - qdrant_cache:/root/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro

  logging:
    build: ./services/logging
    container_name: sharedllm_logging
    restart: unless-stopped
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
    volumes:
      - logging_data:/app/data
      - /etc/localtime:/etc/localtime:ro

  storage:
    build: ./services/storage
    container_name: sharedllm_storage
    restart: unless-stopped
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - RAG_SVC_URL=http://rag:8004
      - TZ=America/Phoenix
    volumes:
      - ./:/workspace/SharedLLM:ro
      - /etc/localtime:/etc/localtime:ro

  workspace_runtime:
    build: ./services/workspace_runtime
    container_name: sharedllm_workspace_runtime
    restart: unless-stopped
    environment:
      - WORKSPACE_DATABASE_URL=sqlite:////data/workspace_runtime.db
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - FERNET_KEY=${FERNET_KEY}
      - IDENTITY_SVC_URL=http://identity:8001
      - STORAGE_SVC_URL=http://storage:8005
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/workspace/SharedLLM
      - TZ=America/Phoenix
    volumes:
      - ./:/workspace/SharedLLM
      - workspace_runtime_data:/data
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - /etc/localtime:/etc/localtime:ro

  redis:
    image: redis:7-alpine
    container_name: sharedllm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  automation:
    build: ./services/automation
    container_name: sharedllm_automation
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_SVC_URL=http://execution:8003
      - INTERNAL_SECRET=${INTERNAL_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
    depends_on:
      - redis
      - execution

  ui:
    build: ./services/ui
    container_name: sharedllm_ui
    restart: unless-stopped
    environment:
      - TZ=America/Phoenix
    depends_on:
      - gateway

volumes:
  identity_db:
  chroma_data:
  logging_data:
  workspace_runtime_data:
  redis_data:
  huggingface_cache:
  qdrant_cache:
  caddy_data:
  caddy_config:
