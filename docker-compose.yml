services:
  caddy:
    image: caddy:2-alpine
    container_name: sharedllm_caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - gateway
      - identity

  identity:
    build: ./services/identity
    container_name: sharedllm_identity
    restart: unless-stopped
    ports:
      - 8001:8001
    extra_hosts:
      - "ollama-server:192.168.2.114"
      - "ai-server:192.168.2.205"
    environment:
      - IDENTITY_DATABASE_URL=sqlite:////data/identity.db
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - TZ=America/Phoenix
    volumes:
      - identity_db:/data
      - ./services/identity/main.py:/app/main.py:ro
      - ./services/identity/models.py:/app/models.py:ro
      - ./services/identity/seed.py:/app/seed.py:ro
      - /etc/localtime:/etc/localtime:ro

  execution:
    build: ./services/execution
    container_name: sharedllm_execution
    restart: always
    ports:
      - 8003:8003
    env_file:
      - .env
    extra_hosts:
      - "ollama-server:192.168.2.114"
      - "ai-server:192.168.2.205"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - RAG_SVC_URL=http://rag:8004
      - IDENTITY_SVC_URL=http://identity:8001
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    security_opt:
      - label=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./services/execution:/app
      - ./services/tests:/app/tests
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace/SharedLLM
      - /home/jeremiah/.ssh:/home/sharedllm/.ssh:ro
      - kokoro_models:/app/models

  rag:
    build: ./services/rag
    container_name: sharedllm_rag
    restart: unless-stopped
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - TZ=America/Phoenix
    ports:
      - "8004:8004"
    volumes:
      - chroma_data:/data
      - huggingface_cache:/root/.cache/huggingface
      - qdrant_cache:/root/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
      - ./services/rag/main.py:/app/main.py
      - ./services/rag/schemas.py:/app/schemas.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  capabilities-sync:
    build: ./services/rag
    container_name: sharedllm_capabilities_sync
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - RAG_SVC_URL=http://rag:8004
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - PYTHONPATH=/app
    depends_on:
      rag:
        condition: service_healthy
    command: python3 scripts/index_capabilities.py

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: sharedllm_gateway
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    extra_hosts:
      - "ollama-server:192.168.2.114"
      - "ai-server:192.168.2.205"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://execution:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - CONTROL_PLANE_URL=http://control_plane:8008
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    volumes:
      - ./data/phrasebook.json:/app/data/phrasebook.json:ro
      - ./services/gateway/main.py:/app/main.py
      - ./services/gateway/background_worker.py:/app/background_worker.py
      - ./services/gateway/orchestrator.py:/app/orchestrator.py
      - ./services/gateway/agent_loop.py:/app/agent_loop.py
      - ./services/gateway/llm_providers.py:/app/llm_providers.py
      - ./services/gateway/config.py:/app/config.py
      - ./services/gateway/messaging.py:/app/messaging.py
      - ./services/gateway/schemas.py:/app/schemas.py
      - ./services/gateway/history.py:/app/history.py
      - ./services/gateway/prompts.py:/app/prompts.py
      - ./services/gateway/intent_engine.py:/app/intent_engine.py
      - huggingface_cache:/home/sharedllm/.cache/huggingface
      - qdrant_cache:/home/sharedllm/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro

  logging:
    build: ./services/logging
    container_name: sharedllm_logging
    restart: unless-stopped
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - TZ=America/Phoenix
    volumes:
      - logging_data:/app/data
      - ./services/logging/main.py:/app/main.py:ro
      - /etc/localtime:/etc/localtime:ro

  storage:
    build: ./services/storage
    container_name: sharedllm_storage
    restart: unless-stopped
    ports:
      - 8005:8005
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - RAG_SVC_URL=http://rag:8004
      - TZ=America/Phoenix
    volumes:
      - ./:/workspace/SharedLLM:ro
      - ./services/storage:/app
      - /etc/localtime:/etc/localtime:ro

  workspace_runtime:
    build: ./services/workspace_runtime
    container_name: sharedllm_workspace_runtime
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    ports:
      - 8007:8007
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - WORKSPACE_DATABASE_URL=sqlite:////data/workspace_runtime.db
      - FERNET_KEY=${FERNET_KEY}
      - IDENTITY_SVC_URL=http://identity:8001
      - STORAGE_SVC_URL=http://storage:8005
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/workspace/SharedLLM
      - GIT_WEBHOOK_SECRET=${GIT_WEBHOOK_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    volumes:
      - ./:/workspace/SharedLLM
      - ./services/workspace_runtime:/app
      - workspace_runtime_data:/data
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - /etc/localtime:/etc/localtime:ro

  redis:
    image: redis:7-alpine
    container_name: sharedllm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  automation:
    build: ./services/automation
    container_name: sharedllm_automation
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_SVC_URL=http://execution:8003
      - TZ=America/Phoenix
    depends_on:
      - redis
      - execution

  ui:
    build: ./services/ui
    container_name: sharedllm_ui
    restart: unless-stopped
    environment:
      - TZ=America/Phoenix
    depends_on:
      - gateway

  control_plane:
    build: ./services/control_plane
    container_name: sharedllm_control_plane
    restart: always
    ports:
      - 8008:8008
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    privileged: true
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/control_plane:/app

volumes:
  identity_db:
  chroma_data:
  logging_data:
  workspace_runtime_data:
  redis_data:
  huggingface_cache:
  qdrant_cache:
  caddy_data:
  caddy_config:
  kokoro_models:
