networks:
  sharedllm:
    external: true
    name: sharedllm_default

services:
  dns-sync:
    build:
      context: .
      dockerfile: services/dns_sync/Dockerfile
    container_name: sharedllm_dns_sync
    restart: unless-stopped
    networks:
      sharedllm:
        ipv4_address: 172.26.0.2
    cap_add:
      - NET_ADMIN
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - IDENTITY_SVC_URL=http://identity:8001
      - DNS_POLL_INTERVAL=30
    depends_on:
      - identity

  caddy:
    image: caddy:2-alpine
    container_name: sharedllm_caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - gateway
      - identity
    networks:
      - sharedllm

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: sharedllm_identity
    restart: unless-stopped
    ports:
      - 8001:8001
    environment:
      - IDENTITY_DATABASE_URL=sqlite:////data/identity.db
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - TZ=America/Phoenix
    volumes:
      - identity_db:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - sharedllm

  execution:
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    container_name: sharedllm_execution
    restart: always
    network_mode: host
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      # Host-networked service: use localhost for inter-service communication
      - IDENTITY_SVC_URL=http://localhost:8001
      - EXECUTION_SVC_URL=http://localhost:8003
      - RAG_SVC_URL=http://localhost:8004
      - STORAGE_SVC_URL=http://localhost:8005
      - LOGGING_SVC_URL=http://localhost:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://localhost:8007
      - REDIS_URL=redis://localhost:6379/0
      - SEARXNG_URL=http://localhost:8080
      - EXECUTION_EXTERNAL_HOST=ai.local
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
      - WORKSPACE_ROOT=/workspaces
    security_opt:
      - label=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jeremiah/.ssh:/home/sharedllm/.ssh:ro
      - kokoro_models:/app/models
      - ${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}:/workspaces
      - execution_data:/data

  rag:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: sharedllm_rag
    restart: unless-stopped
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://localhost:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - TZ=America/Phoenix
    ports:
      - "8004:8004"
    volumes:
      - chroma_data:/data
      - huggingface_cache:/root/.cache/huggingface
      - qdrant_cache:/root/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - sharedllm

  capabilities-sync:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: sharedllm_capabilities_sync
    working_dir: /app
    environment:
      - RAG_SVC_URL=http://rag:8004
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      rag:
        condition: service_healthy
    command: python3 scripts/index_capabilities.py
    networks:
      - sharedllm

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: sharedllm_gateway
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    dns:
      - "172.26.0.2"
      - "127.0.0.11"
    depends_on:
      - dns-sync
    extra_hosts:
      - "ai-server:192.168.2.205"
      - "host.docker.internal:host-gateway"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://host.docker.internal:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - CONTROL_PLANE_URL=http://control_plane:8008
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    volumes:
      - ./data/phrasebook.json:/app/data/phrasebook.json:ro
      - huggingface_cache:/home/sharedllm/.cache/huggingface
      - qdrant_cache:/home/sharedllm/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    networks:
      - sharedllm

  logging:
    build:
      context: .
      dockerfile: services/logging/Dockerfile
    container_name: sharedllm_logging
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://localhost:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    networks:
      - sharedllm

  automation:
    build:
      context: .
      dockerfile: services/automation/Dockerfile
    container_name: sharedllm_automation
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://localhost:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - execution
    networks:
      - sharedllm

  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    container_name: sharedllm_storage
    restart: unless-stopped
    ports:
      - 8005:8005
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://localhost:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - sharedllm

  workspace_runtime:
    build:
      context: .
      dockerfile: services/workspace_runtime/Dockerfile
    container_name: sharedllm_workspace_runtime
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    ports:
      - 8007:8007
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://localhost:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - WORKSPACE_DATABASE_URL=sqlite:////data/workspace_runtime.db
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/workspaces
      - GIT_WEBHOOK_SECRET=${GIT_WEBHOOK_SECRET:-change-me-in-production}
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    volumes:
      - ${WORKSPACE_HOST_PATH:-/home/jeremiah/workspaces}:/workspaces
      - workspace_runtime_data:/data
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - sharedllm

  ui:
    build: ./services/ui
    container_name: sharedllm_ui
    restart: unless-stopped
    environment:
      - TZ=America/Phoenix
    depends_on:
      - gateway
    networks:
      - sharedllm

  redis:
    image: redis:7-alpine
    container_name: sharedllm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sharedllm

  control_plane:
    build:
      context: .
      dockerfile: services/control_plane/Dockerfile
    container_name: sharedllm_control_plane
    restart: always
    ports:
      - 8008:8008
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-999}"
    security_opt:
      - label=disable
    privileged: true
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=http://ollama-server:11434
      - IDENTITY_SVC_URL=http://identity:8001
      - EXECUTION_SVC_URL=http://localhost:8003
      - RAG_SVC_URL=http://rag:8004
      - STORAGE_SVC_URL=http://storage:8005
      - LOGGING_SVC_URL=http://logging:8006
      - WORKSPACE_RUNTIME_SVC_URL=http://workspace_runtime:8007
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TZ=America/Phoenix
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    networks:
      - sharedllm

volumes:
  identity_db:
  chroma_data:
  logging_data:
  workspace_runtime_data:
  redis_data:
  huggingface_cache:
  qdrant_cache:
  caddy_data:
  caddy_config:
  kokoro_models:
  execution_data:
