networks:
  sharedllm:
    name: sharedllm_default
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

services:
  dns:
    image: ghcr.io/jmiahman1/sharedllm-dns:latest
    build:
      context: .
      dockerfile: services/dns/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_dns
    restart: unless-stopped
    mem_limit: 256m
    # Runs as the host user. It still binds 53 inside the container (published on
    # 15353), which is what the capability is for, and it reads the Docker socket
    # to discover containers, which is what the group is for - the socket is
    # root:docker, mode 660.
    user: "${PUID}:${PGID}"
    group_add:
      - "${DOCKER_GID}"
    cap_add:
      - NET_BIND_SERVICE
    networks:
      sharedllm:
        ipv4_address: 172.26.0.254
    ports:
      - "15353:53/udp"
      - "15353:53/tcp"
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - DNS_PORT=53
      - UPSTREAM_DNS=${UPSTREAM_DNS:-1.1.1.1}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}

  caddy:
    image: ghcr.io/jmiahman1/sharedllm-caddy:latest
    container_name: sharedllm_caddy
    restart: unless-stopped
    mem_limit: 256m
    # The front door runs as the host user too: it is the one service a stranger
    # reaches directly, so it should not be root. It still binds 80 and 443 inside
    # the container (published on high host ports), which is what the capability
    # is for; the two state volumes were chowned to match.
    user: "${PUID}:${PGID}"
    cap_add:
      - NET_BIND_SERVICE
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      # The reverse proxy in front of this stack (docs/PUSH.md, "Limits").
      - PUBLIC_PROXY_IP=${PUBLIC_PROXY_IP:-127.0.0.1}
    networks:
      - sharedllm
    ports:
      - "8080:80"
      - "8443:443"
      - "8001:8001"  # Host:8001 -> Caddy -> identity:8001
      - "8095:8095"  # Host:8095 -> Caddy -> ma:8095
      - "11435:11435" # Host:11435 -> Caddy -> gateway:11435
      - "8004:8004"  # Host:8004 -> Caddy -> rag:8004
      - "8005:8005"  # Host:8005 -> Caddy -> storage:8005
      - "8006:8006"  # Host:8006 -> Caddy -> logging:8006
      - "8007:8007"  # Host:8007 -> Caddy -> workspace_runtime:8007
      - "8008:8008"  # Host:8008 -> Caddy -> control_plane:8008
      - "8009:8009"  # Host:8009 -> Caddy -> geo:8009
      - "8010:8010"  # Host:8010 -> Caddy -> bible:8010
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - gateway
      - identity
    dns:
      - 172.26.0.254

  identity:
    image: ghcr.io/jmiahman1/sharedllm-identity:latest
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_identity
    restart: unless-stopped
    mem_limit: 1g
    # Runs as the host user that owns ./data/identity, so nothing it writes is
    # root-owned and a compromise does not start as root.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - IDENTITY_DATABASE_URL=sqlite:////data/identity.db
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - LEGACY_ENV_PATH=/app/.env
      - FORCE_RESEED=${FORCE_RESEED:-false}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - TZ=America/Phoenix
    volumes:
      - ./data/identity:/data
      - /etc/localtime:/etc/localtime:ro
      - ./.env:/app/.env:ro
      - ./prompts:/app/prompts:ro
    dns:
      - 172.26.0.254
    networks:
      - sharedllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  execution:
    image: ghcr.io/jmiahman1/sharedllm-execution:latest
    build:
      context: .
      dockerfile: services/execution/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_execution
    restart: always
    mem_limit: 3g
    network_mode: host
    # Run as the same uid/gid as workspace_runtime so all git/shell operations
    # in /workspaces produce files owned by uid 1000 (not root). The IDE commits
    # via workspace_runtime (uid 1000), so a root-owned .git created by the
    # execution service would otherwise cause "Permission denied" on index.lock.
    user: "${PUID}:${PGID}"
    group_add:
      - "${DOCKER_GID}"
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=host
      - IDENTITY_SVC_URL=${HOST_IDENTITY_SVC_URL}
      # Telemetry keeps a fixed bridge address (it publishes no host port);
      # reachable from this host-networked container for the activity feed
      # and every execution-origin notice.
      - TELEMETRY_SVC_URL=${HOST_TELEMETRY_SVC_URL}
      - EXECUTION_SVC_URL=${HOST_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${HOST_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${HOST_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${HOST_WORKSPACE_RUNTIME_SVC_URL}
      - REDIS_URL=${HOST_REDIS_URL}
      - SEARXNG_URL=${HOST_SEARXNG_URL}
      # Execution runs on the host network, so the address it hands to TVs,
      # speakers and phones must be the host's own external/LAN address,
      # never a docker service alias. Sourced from .env (untracked, per install)
      # instead of baking one private address into this shared file.
      - EXECUTION_EXTERNAL_HOST=${EXECUTION_EXTERNAL_HOST}
      # Device discovery. SCAN_SUBNET/LOCAL_SUBNET are only needed when the host
      # network cannot be read (bridge mode); ROUTER_IP enables the SNMP ARP
      # lookup, which declines without it rather than probing a default router.
      - SCAN_SUBNET=${SCAN_SUBNET:-}
      - LOCAL_SUBNET=${LOCAL_SUBNET:-}
      - ROUTER_IP=${ROUTER_IP:-}
      - TEMP_MEDIA_DIR=/workspaces
      - MODELS_DIR=/workspaces/models
      - TZ=America/Phoenix
      - FAMILY_GAMES_ENABLED=${FAMILY_GAMES_ENABLED:-1}
      - HOME=/home/sharedllm
      - WORKSPACE_ROOT=/workspaces
      # Host path that /workspaces maps to, so the sandbox can mount the real
      # workspace data (the Docker daemon resolves mount sources on the host).
      - WORKSPACE_HOST_PATH=${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH must name the host directory to mount at /workspaces (see .env.example)}
    security_opt:
      - label=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_SSH_DIR:?HOST_SSH_DIR must name the host .ssh directory (see .env.example)}:/home/sharedllm/.ssh:ro
      - kokoro_models:/app/models
      - ${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH must name the host directory to mount at /workspaces (see .env.example)}:/workspaces
      - execution_data:/data
      # The offline recipe index is a host file (gitignored, rebuilt by
      # scripts/build_recipe_seed.py) so it can be swapped without a new image.
      - ./data/recipes:/data/recipes
      # DNS via the gateway's dnsmasq so .local hostnames (synced by the DNS
      # sync service) resolve inside this host-networked container; resolv.conf
      # cannot be baked at build time (buildkit bind-mounts it read-only).
      - ./services/execution/resolv.conf:/etc/resolv.conf:ro

  rag:
    image: ghcr.io/jmiahman1/sharedllm-rag:latest
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_rag
    restart: unless-stopped
    mem_limit: 6g
    # Runs as the host user that owns the /data volume, not root: this service
    # embeds whatever the family indexes, so it is the one most exposed to
    # untrusted content. Its model cache therefore lives under HOME rather than
    # /root, and the cache volumes are owned to match.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - HOME=/home/sharedllm
      - RAG_DB_PATH=/data/rag.db
      - TZ=America/Phoenix
      - HUGGINGFACE_HUB_DISABLE_XET=1
      - EMBEDDING_MODEL=nomic-ai/nomic-embed-text-v1.5
      - ALPACA_BENCHMARKS_PATH=http://192.168.2.43:5000/api/tests
      - ALPACA_BENCHMARK_RESULTS_DIR=http://192.168.2.43:5000/api/tests
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - chroma_data:/data
      # The same volumes the gateway mounts, at the path HOME points at, so the
      # model cache is shared and neither service needs to be root to read it.
      - huggingface_cache:/home/sharedllm/.cache/huggingface
      - qdrant_cache:/home/sharedllm/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  capabilities-sync:
    image: ghcr.io/jmiahman1/sharedllm-rag:latest
    build:
      context: .
      dockerfile: services/rag/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_capabilities_sync
    mem_limit: 512m
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      - NETWORK_MODE=bridge
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
    depends_on:
      rag:
        condition: service_healthy
    command: python3 scripts/index_capabilities.py
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  gateway:
    image: ghcr.io/jmiahman1/sharedllm-gateway:latest
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_gateway
    restart: unless-stopped
    mem_limit: 4g
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    depends_on:
      identity:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - CONTROL_PLANE_URL=http://control_plane:8008
      - BRIDGE_HEALTH_SVC_URL=${BRIDGE_HEALTH_SVC_URL:-http://health:8011}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - TZ=America/Phoenix
      - HOME=/home/sharedllm
    volumes:
      - ./data/phrasebook.json:/app/data/phrasebook.json:ro
      - ./data/app_updates:/app/data/app_updates
      - ./data/mdm_files:/app/data/mdm_files
      - huggingface_cache:/home/sharedllm/.cache/huggingface
      - qdrant_cache:/home/sharedllm/.cache/qdrant
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 172.26.0.254
    networks:
      # Fixed address: ntfy exempts it from rate limits (ntfy/server.yml).
      sharedllm:
        ipv4_address: 172.26.0.252

  logging:
    image: ghcr.io/jmiahman1/sharedllm-logging:latest
    build:
      context: .
      dockerfile: services/logging/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_logging
    restart: unless-stopped
    mem_limit: 512m
    # Runs as the host user, not root: it writes nothing outside its own
    # image, and a container that cannot write anywhere is one less thing to
    # trust.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  automation:
    image: ghcr.io/jmiahman1/sharedllm-automation:latest
    build:
      context: .
      dockerfile: services/automation/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_automation
    restart: unless-stopped
    mem_limit: 512m
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID}"
    security_opt:
      - label=disable
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - execution
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  telemetry:
    image: ghcr.io/jmiahman1/sharedllm-telemetry:latest
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_telemetry
    restart: unless-stopped
    mem_limit: 512m
    # Runs as the host user: it writes nothing outside its own image (its state
    # is in Redis), so there is no reason for it to be root.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - GEO_SVC_URL=${BRIDGE_GEO_SVC_URL}
      - GATEWAY_INTERNAL_URL=${BRIDGE_GATEWAY_SVC_URL}
      - AUTOMATION_SVC_URL=${BRIDGE_AUTOMATION_SVC_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - gateway
      - geo
      - identity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 172.26.0.254
    networks:
      # Fixed address: ntfy exempts it from rate limits (ntfy/server.yml).
      sharedllm:
        ipv4_address: 172.26.0.253

  storage:
    image: ghcr.io/jmiahman1/sharedllm-storage:latest
    build:
      context: .
      dockerfile: services/storage/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_storage
    restart: unless-stopped
    mem_limit: 1g
    # Runs as the host user that owns ./data/storage, so nothing it writes is
    # root-owned and a compromise does not start as root.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL:-}
      - NEXTCLOUD_USER=${NEXTCLOUD_USER:-}
      - NEXTCLOUD_PASS=${NEXTCLOUD_PASS:-}
      - STORAGE_CHECKPOINT_PATH=${STORAGE_CHECKPOINT_PATH:-/data/index_checkpoint.json}
      - ARTIFACTS_ROOT=/artifacts
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/storage:/data
      - storage_artifacts:/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  workspace_runtime:
    image: ghcr.io/jmiahman1/sharedllm-workspace_runtime:latest
    build:
      context: .
      dockerfile: services/workspace_runtime/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_workspace_runtime
    restart: unless-stopped
    mem_limit: 1.5g
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID}"
    security_opt:
      - label=disable
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - WORKSPACE_DATABASE_URL=sqlite:////data/workspace_runtime.db
      - WORKSPACE_REGISTRY_PATH=/app/config/workspaces.json
      - WORKSPACE_RUNTIME_ROOT=/workspaces
      - GIT_WEBHOOK_SECRET=${GIT_WEBHOOK_SECRET:-}
      - TZ=America/Phoenix
      - HOME=/home/raven
      # Host path that /workspaces maps to, so the sandbox can mount the real
      # workspace data (the Docker daemon resolves mount sources on the host).
      - WORKSPACE_HOST_PATH=${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH must name the host directory to mount at /workspaces (see .env.example)}
      # The LAN address a device uses to reach a forwarded workspace port. The
      # sandbox refuses to open a forward without it rather than guessing.
      - EXECUTION_EXTERNAL_HOST=${EXECUTION_EXTERNAL_HOST:?EXECUTION_EXTERNAL_HOST must be this host's LAN address (see .env.example)}
    volumes:
      - ${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH must name the host directory to mount at /workspaces (see .env.example)}:/workspaces
      - ${REPO_HOST_PATH:?REPO_HOST_PATH must name this checkout on the host (see .env.example)}:/host-repo
      - workspace_runtime_data:/data
      - ./config/workspaces.json:/app/config/workspaces.json:ro
      - /etc/localtime:/etc/localtime:ro
      # Allow the runtime to spawn per-workspace sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  ui:
    image: ghcr.io/jmiahman1/sharedllm-ui:latest
    build:
      context: ./services/ui
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-ui}
    container_name: sharedllm_ui
    restart: unless-stopped
    mem_limit: 256m
    # nginx serves the app as the host user. It needs a writable cache (proxy
    # and upload temp files - attachments can be 20 MB) and a writable /run for
    # its pid, which is exactly what these two tmpfs mounts give it. Verified by
    # running the published image as uid 1000 on the sharedllm network: static
    # files 200, /api proxied to the gateway 200.
    user: "${PUID}:${PGID}"
    tmpfs:
      - /var/cache/nginx:mode=1777,size=128m
      - /var/run:mode=1777,size=8m
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - TZ=America/Phoenix
    depends_on:
      - gateway
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  bible:
    image: ghcr.io/jmiahman1/sharedllm-bible:latest
    build:
      context: .
      dockerfile: services/bible/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_bible
    restart: unless-stopped
    mem_limit: 512m
    # Runs as the host user that owns ./data/bible, so nothing it writes is
    # root-owned and a compromise does not start as root.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - NETWORK_MODE=bridge
      - BIBLE_DATABASE_URL=${BIBLE_DATABASE_URL:-sqlite:////data/bible.db}
      - BLB_BASE_URL=${BLB_BASE_URL}
      - BIBLE_DEVOTIONAL_DIR=${BIBLE_DEVOTIONAL_DIR}
      - BIBLE_BOOKS_PATH=${BIBLE_BOOKS_PATH:-/Books}
      - BIBLE_API_KEY=${BIBLE_API_KEY}
      - BIBLE_PROVIDER_CACHE=${BIBLE_PROVIDER_CACHE}
      - BIBLE_PROVIDER_CALL_BUDGET=${BIBLE_PROVIDER_CALL_BUDGET}
      - CALIBRE_LIBRARY_PATH=${CALIBRE_LIBRARY_PATH}
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - GEO_SVC_URL=${BRIDGE_GEO_SVC_URL:-http://geo:8009}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - GATEWAY_INTERNAL_URL=http://gateway:11435
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/bible:/data
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 172.26.0.254
    networks:
      - sharedllm

  # Health hub store: profiles, sleep, check-ins, nutrition and open metric
  # ingestion. Activity stays in geo; this service only owns what geo does not.
  health:
    image: ghcr.io/jmiahman1/sharedllm-health:latest
    build:
      context: .
      dockerfile: services/health/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_health
    restart: unless-stopped
    mem_limit: 256m
    # Runs as the host user that owns ./data/health, so nothing it writes is
    # root-owned and a compromise does not start as root.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - HEALTH_DATABASE_URL=${HEALTH_DATABASE_URL:-sqlite:////data/health.db}
      - TZ=America/Phoenix
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/health:/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 172.26.0.254
    networks:
      - sharedllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Road network for snapping trip routes to roads (services/geo/map_match.py).
  # Built with its map data by .github/workflows/osrm-map.yml (regions in
  # osrm/regions.txt) and pulled here. Self-hosted so the family's locations
  # never leave this server.
  osrm:
    image: ghcr.io/jmiahman1/sharedllm-osrm:latest
    container_name: sharedllm_osrm
    restart: unless-stopped
    mem_limit: 1536m
    networks:
      - sharedllm

  # The foot network the same build makes: workout routes snap to paths and trails.
  osrm-foot:
    image: ghcr.io/jmiahman1/sharedllm-osrm-foot:latest
    container_name: sharedllm_osrm_foot
    restart: unless-stopped
    # The foot graph is bigger than the road one (paths, sidewalks): ~1.2 GB idle
    mem_limit: 2g
    networks:
      - sharedllm

  # Place names <-> coordinates on the server (geo NOMINATIM_URL), so trip
  # positions are not sent to the public Nominatim. Imports NOMINATIM_PBF_URL
  # on first start (tens of minutes); until then, and for places outside it,
  # geo asks the public service.
  nominatim:
    image: mediagis/nominatim:5.3
    container_name: sharedllm_nominatim
    restart: unless-stopped
    mem_limit: 3g
    shm_size: 1g
    environment:
      - PBF_URL=${NOMINATIM_PBF_URL:-https://download.geofabrik.de/north-america/us/arizona-latest.osm.pbf}
      - IMPORT_US_POSTCODES=true
      - THREADS=4
      - NOMINATIM_PASSWORD=${NOMINATIM_DB_PASSWORD:-nominatim-internal}
    volumes:
      - ./data/nominatim:/var/lib/postgresql/16/main
      - ./docker/nominatim/postgres-tuning.conf:/etc/postgresql/16/main/conf.d/postgres-tuning.conf:ro
    networks:
      - sharedllm

  geo:
    image: ghcr.io/jmiahman1/sharedllm-geo:latest
    build:
      context: .
      dockerfile: services/geo/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    container_name: sharedllm_geo
    restart: unless-stopped
    mem_limit: 512m
    # Runs as the host user, not root: it writes nothing outside its own
    # image, and a container that cannot write anywhere is one less thing to
    # trust.
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - GEO_SVC_URL=${BRIDGE_GEO_SVC_URL:-http://geo:8009}
      - REDIS_URL=${BRIDGE_REDIS_URL}
      - GATEWAY_INTERNAL_URL=http://gateway:11435
      - TZ=America/Phoenix
      - OSRM_URL=${OSRM_URL:-http://osrm:5000}
      - OSRM_FOOT_URL=${OSRM_FOOT_URL:-http://osrm-foot:5000}
      - NOMINATIM_URL=${NOMINATIM_URL:-http://nominatim:8080}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 172.26.0.254
    networks:
      - sharedllm

  redis:
    image: redis:7-alpine
    container_name: sharedllm_redis
    restart: unless-stopped
    mem_limit: 512m
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  # Push server for phone notifications and UnifiedPush (docs/PUSH.md).
  # Upstream image, nothing to build. Internal only: Caddy forwards just
  # POST /push/up* here. The jarvis user and token come from .env; an empty
  # value leaves ntfy up but unreadable, and the senders log and carry on.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: sharedllm_ntfy
    restart: unless-stopped
    mem_limit: 256m
    command: serve
    environment:
      - NTFY_AUTH_USERS=${NTFY_AUTH_USERS:-}
      - NTFY_AUTH_TOKENS=${NTFY_AUTH_TOKENS:-}
      - NTFY_PROXY_TRUSTED_HOSTS=${PUBLIC_PROXY_IP:-127.0.0.1}
      - TZ=America/Phoenix
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

  control_plane:
    image: ghcr.io/jmiahman1/sharedllm-control_plane:latest
    build:
      context: .
      dockerfile: services/control_plane/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
        - SERVICE_NAME=${SERVICE_NAME:-unknown}
    hostname: control-plane.local
    container_name: sharedllm_control_plane
    restart: always
    mem_limit: 1g
    user: "${PUID}:${PGID}"
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID}"
    security_opt:
      - label=disable
    privileged: true
    environment:
      # Somewhere writable: with HOME unset a container inherits HOME=/ and any tool that wants a cache fails on the read-only root.
      - HOME=/tmp
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - NETWORK_MODE=bridge
      - IDENTITY_SVC_URL=${BRIDGE_IDENTITY_SVC_URL}
      - EXECUTION_SVC_URL=${BRIDGE_EXECUTION_SVC_URL}
      - STORAGE_SVC_URL=${BRIDGE_STORAGE_SVC_URL}
      - LOGGING_SVC_URL=${BRIDGE_LOGGING_SVC_URL}
      - WORKSPACE_RUNTIME_SVC_URL=${BRIDGE_WORKSPACE_RUNTIME_SVC_URL}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TZ=America/Phoenix
      - GHCR_TOKEN=${GHCR_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      # Read-only, only so the disk check can see free space on the disks
      # that hold the stack's data (services/control_plane/disk_alerts.py).
      - ./data:/hostfs/data:ro
      - ${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH must name the host directory to mount at /workspaces (see .env.example)}:/hostfs/workspaces:ro
      - /var/lib/docker:/hostfs/docker:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 172.26.0.254
    networks:
      - sharedllm

volumes:
  chroma_data:
  logging_data:
  workspace_runtime_data:
  redis_data:
  huggingface_cache:
  qdrant_cache:
  caddy_data:
  caddy_config:
  kokoro_models:
  execution_data:
  ntfy_data:
  storage_artifacts:
